function init() {
  S = loadState();
  invalidateIndex();
  _fmtCache = {};
  UI.rentMonth = thisMonth();
  UI.exportYear = fyRange(0).fyStartYear;
  UI.view = (S.settings.startPage && VIEWS[S.settings.startPage]) ? S.settings.startPage : 'dashboard';
  if (UI.view === 'property') UI.view = 'properties';
  UI.period = S.payments.length || S.expenses.length ? 'ytd' : 'all';
  render();

  if (!S.settings.onboarded) {
    demoSeed();
  } else if (!storageOK) {
    toast('This browser is blocking local storage, so changes will not be saved between visits.', 'err');
  }
}
/* ============================================================
   Rental Property Hub — hosted demo layer.

   build-demo.mjs splices this INSIDE the app's closure, just ahead of
   init(), so it can reach the app's private functions and S. Nothing
   here is in the buyer file; the build asserts that.

   Three places create the entries the demo counts: the Record rent
   form, the expense form (new expenses only) and the CSV importer. The
   build patches each one to ask for room first and to report what
   actually landed afterwards. Everything else stays free — properties,
   units, tenants, leases, maintenance, notes, adjustments, other income,
   mileage, editing and deleting. A demo that fights you is not a demo.
   ============================================================ */

/* The two settings worth editing. Swap in the direct listing URL once the
   listing is live; it converts better than the shop front, and the ref is
   how Etsy Stats attributes the traffic the demo sends. */
var DEMO_BUY_URL = "https://www.etsy.com/shop/FinNestStudio?ref=demo";
var DEMO_CAP = 40;

/* The counter lives beside the app's state, not in it, so an exported
   backup carries no demo bookkeeping into the full version. */
var DEMO_COUNT_KEY = STORE_KEY + '.logged';

function demoLogged() {
  try {
    var n = parseInt(localStorage.getItem(DEMO_COUNT_KEY) || '0', 10);
    return isFinite(n) && n > 0 ? n : 0;
  } catch (e) { return 0; }
}
function demoSetLogged(n) {
  try { localStorage.setItem(DEMO_COUNT_KEY, String(n)); } catch (e) {}
}
function demoLeft() { return Math.max(0, DEMO_CAP - demoLogged()); }

/* ---------------- the cap ---------------- */

/** Asked by each patched write site before it commits `n` new entries. */
function demoAllow(n) {
  if (n <= demoLeft()) return true;
  setTimeout(function () { demoCapReached(n); }, 60);
  return false;
}

/** Told by each patched write site how many new entries actually landed. */
function demoCounted(n) {
  if (!(n > 0)) return;
  demoSetLogged(demoLogged() + n);
  paintDemoBar();
  /* let the "recorded" toast land before taking the room away */
  if (demoLeft() === 0) setTimeout(function () { demoCapReached(0); }, 900);
}

/* ---------------- what a visitor sees at the cap ---------------- */
function demoCapReached(asked) {
  if (byId('demoNotice')) return;
  var left = demoLeft();
  var tooBig = asked > 1 && left > 0;
  var p = '<p style="margin:0;font-size:13.5px;line-height:1.6;color:var(--text-2)">';
  openModal(modalShell({
    narrow: true,
    title: tooBig ? 'That import is bigger than the demo' : 'That is all ' + DEMO_CAP + ' entries the demo holds',
    sub: 'Nothing you entered is lost',
    body: '<div class="stack" id="demoNotice">' +
      (tooBig
        ? p + 'This file has <strong>' + asked + '</strong> rent payments and expenses, and the demo has room for <strong>' +
          left + '</strong> more. The full version imports all of it.</p>'
        : p + 'You have logged ' + DEMO_CAP + ' rent payments and expenses, enough to see how Rental Property Hub handles a real month.</p>') +
      p + 'Download your backup and the full version opens it exactly as it stands, with every property, tenant, lease, ' +
        'payment, expense and repair still in place. The full version has no limit and no subscription.</p>' +
      '</div>',
    foot: '<button class="btn btn-ghost" data-demo="reset">Reset the demo</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn" data-demo="export">' + ico('download') + 'Download my backup</button>' +
      '<button class="btn btn-primary" data-demo="buy">Get the full version</button>'
  }));
  bindModalClose();
}

function demoReset() {
  /* a debounced save still pending would write the old state straight back */
  clearTimeout(_saveTimer);
  try {
    localStorage.removeItem(STORE_KEY);
    localStorage.removeItem(DEMO_COUNT_KEY);
  } catch (e) {}
  location.reload();
}

document.addEventListener('click', function (e) {
  var el = e.target && e.target.closest ? e.target.closest('[data-demo]') : null;
  if (!el) return;
  e.preventDefault();
  var what = el.getAttribute('data-demo');
  if (what === 'buy') {
    window.open(DEMO_BUY_URL, '_blank', 'noopener');
  } else if (what === 'export') {
    doBackup();
  } else if (what === 'reset') {
    confirmDialog({
      title: 'Reset the demo?', danger: true, okLabel: 'Reset the demo',
      body: 'Everything you entered here is removed and the sample portfolio comes back. Download a backup first if you want to keep your work.',
      onConfirm: demoReset
    });
  }
});

/* ---------------- first visit ----------------
   Open straight onto the product's own sample portfolio instead of the
   welcome screen, and without the "Undo" toast loadSampleData() offers —
   undoing it here would leave a visitor an empty demo. buildSampleData()
   marks the state onboarded, so this runs once per visitor; clearing the
   sample later does not bring it back. */
function demoSeed() {
  S = buildSampleData();
  invalidateIndex();
  _fmtCache = {};
  UI.view = 'dashboard';
  UI.period = 'ytd';
  UI.rentMonth = thisMonth();
  save(true);
  render();
}

/* ---------------- the banner, with a live count ---------------- */
function paintDemoBar() {
  var bar = byId('demoBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'demoBar';
    bar.innerHTML =
      '<span class="db-note">Free demo<span class="db-more"> · sample portfolio, and nothing leaves your browser</span></span>' +
      '<span class="db-count" id="demoCount"></span>' +
      '<a class="db-buy" id="demoBuy" href="' + DEMO_BUY_URL + '" target="_blank" rel="noopener">Get the full version</a>' +
      '<button type="button" class="db-reset" data-demo="reset">Reset</button>';
    document.body.insertBefore(bar, document.body.firstChild);
  }
  var left = demoLeft();
  var c = byId('demoCount');
  c.innerHTML = left > 0
    ? demoLogged() + ' of ' + DEMO_CAP + '<span class="dc-long"> payments &amp; expenses logged</span>'
    : 'Demo full<span class="dc-long"> · ' + DEMO_CAP + ' of ' + DEMO_CAP + ' logged</span>';
  c.classList.toggle('low', left <= 5);
}
