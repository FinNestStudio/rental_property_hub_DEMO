      sortTh('owing', 'tenant', 'Tenant') +
      sortTh('owing', 'property', 'Property & unit') +
      '<th scope="col">Month</th>' +
      sortTh('owing', 'dueDate', 'Due date') +
      '<th class="r" scope="col">Rent due</th><th class="r" scope="col">Paid</th>' +
      sortTh('owing', 'balance', 'Remaining', 'r') +
      sortTh('owing', 'daysOverdue', 'Overdue', 'r') +
      '<th scope="col">Status</th><th></th></tr></thead><tbody>';
  sorted.forEach(function (x) {
    h += '<tr>' +
      '<td><button class="linkish" data-act="open-tenant" data-id="' + attr(x.tenantId) + '">' + esc(tenantName(x.tenantId)) + '</button></td>' +
      '<td><span class="cell-main">' + esc(propertyName(x.propertyId)) + '</span><div class="cell-sub">' + esc(unitName(x.unitId)) + '</div></td>' +
      '<td class="n">' + esc(fmtMonth(x.period)) + '</td>' +
      '<td class="n">' + esc(fmtDate(x.dueDate)) + '</td>' +
      '<td class="r n">' + money(x.due) + '</td>' +
      '<td class="r n">' + money(x.paid) + '</td>' +
      '<td class="r n"><strong class="neg">' + money(x.balance) + '</strong></td>' +
      '<td class="r n">' + (x.daysOverdue > 0 ? x.daysOverdue + ' ' + plural(x.daysOverdue, 'day') : '<span class="muted">Due today</span>') + '</td>' +
      '<td>' + rentBadge(x.status) + '</td>' +
      '<td class="r"><div class="rowact">' +
        '<button class="icon-btn good" data-act="pay-period" data-lease="' + attr(x.leaseId) + '" data-period="' + attr(x.period) + '" title="Record payment" aria-label="Record payment">' + ico('plus') + '</button>' +
        '<button class="icon-btn" data-act="period-detail" data-lease="' + attr(x.leaseId) + '" data-period="' + attr(x.period) + '" title="Details" aria-label="Details">' + ico('eye') + '</button>' +
      '</div></td></tr>';
  });
  h += '</tbody></table></div></div></section>';
  h += '<div class="disclaimer">Balances are worked out from the rent you recorded and the payments received. Use an adjustment if a balance should be reduced or written off. This tool does not provide legal advice on rent arrears — local rules vary.</div>';
  return h;
}

function rentCalendarTab() {
  var ym = UI.rentMonth || thisMonth();
  var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1;
  var first = new Date(y, m, 1);
  var startDow = (first.getDay() + 6) % 7;           // Monday-first grid
  var dim = daysInMonth(y, m);
  var obs = obligationsForMonth(ym);

  /* Bucket every event onto the day it belongs to. */
  var events = {};
  function push(day, ev) {
    var k = String(day);
    if (!events[k]) events[k] = [];
    events[k].push(ev);
  }
  obs.forEach(function (o) {
    var d = +o.dueDate.slice(8, 10);
    var cls = o.balance <= EPS ? 'paid' : (o.daysOverdue > 0 ? 'late' : 'due');
    push(d, { cls: cls, text: unitName(o.unitId) + ' · ' + moneyShort(o.due) });
    o.payments.forEach(function (p) {
      if (monthOf(p.date) === ym) push(+p.date.slice(8, 10), { cls: 'paid', text: 'Paid ' + moneyShort(p.amount) + ' · ' + tenantName(o.tenantId).split(' ')[0] });
    });
  });
  S.leases.forEach(function (l) {
    if (l.end && monthOf(l.end) === ym) push(+l.end.slice(8, 10), { cls: 'lease', text: 'Lease ends · ' + unitName(l.unitId) });
    if (l.start && monthOf(l.start) === ym) push(+l.start.slice(8, 10), { cls: 'lease', text: 'Lease starts · ' + unitName(l.unitId) });
  });

  var cells = '';
  DOW_SHORT.forEach(function (d) { cells += '<div class="dow">' + esc(d) + '</div>'; });
  for (var i = 0; i < startDow; i++) cells += '<div class="cell out"></div>';
  var today = todayISO();
  for (var d = 1; d <= dim; d++) {
    var iso = ym + '-' + (d < 10 ? '0' : '') + d;
    var evs = events[String(d)] || [];
    cells += '<div class="cell' + (iso === today ? ' today' : '') + '">' +
      '<span class="dn">' + d + '</span>' +
      evs.slice(0, 3).map(function (e) { return '<span class="ev ' + e.cls + '" title="' + attr(e.text) + '">' + esc(e.text) + '</span>'; }).join('') +
      (evs.length > 3 ? '<span class="more">+' + (evs.length - 3) + ' more</span>' : '') +
      '</div>';
  }
  var trailing = (7 - ((startDow + dim) % 7)) % 7;
  for (var t = 0; t < trailing; t++) cells += '<div class="cell out"></div>';

  return '<section class="card"><div class="card-head">' +
    '<div><h3>Rent calendar</h3><div class="hint">Rent due dates, payments received and lease changes</div></div>' +
    '<div class="spacer"></div>' + monthNav(ym, 'rent-prev', 'rent-next') + '</div>' +
    '<div class="card-body"><div class="cal">' + cells + '</div>' +
    '<div class="legend" style="margin-top:12px">' +
      '<span class="li"><span class="sw" style="background:var(--blue-soft);border:1px solid var(--blue)"></span>Rent due</span>' +
      '<span class="li"><span class="sw" style="background:var(--pos-soft);border:1px solid var(--pos)"></span>Payment received</span>' +
      '<span class="li"><span class="sw" style="background:var(--neg-soft);border:1px solid var(--neg)"></span>Overdue</span>' +
      '<span class="li"><span class="sw" style="background:var(--lav-soft);border:1px solid var(--lav)"></span>Lease change</span>' +
    '</div></div></section>';
}

/* ==========================================================================

function viewExpenses() {
  var r = currentRange();
  var tabs = [
    { id: 'property', label: 'Property expenses' },
    { id: 'business', label: 'Business costs' },
    { id: 'recurring', label: 'Recurring' },
    { id: 'income', label: 'Other income' },
    { id: 'mileage', label: 'Mileage' }
  ];
  var h = '<div class="stack">';
  h += '<div class="tabs inline no-print">' + tabs.map(function (t) {
    return '<button data-etab="' + t.id + '" class="' + (UI.expTab === t.id ? 'on' : '') + '">' + esc(t.label) + '</button>';
  }).join('') + '</div>';

  if (UI.expTab === 'business') h += expBusinessTab(r);
  else if (UI.expTab === 'recurring') h += expRecurringTab();
  else if (UI.expTab === 'income') h += expIncomeTab(r);
  else if (UI.expTab === 'mileage') h += expMileageTab(r);
  else h += expPropertyTab(r);

  h += '</div>';
  return h;
}

function filteredExpenses(r, scope) {
  var f = UI.expFilter;
  var range = r;
  if (isValidISO(f.from) || isValidISO(f.to)) {
    range = { from: isValidISO(f.from) ? f.from : '1900-01-01', to: isValidISO(f.to) ? f.to : '2999-12-31' };
  }
  return S.expenses.filter(function (e) {
    if (e.scope !== scope) return false;
    if (!inRange(e.date, range)) return false;
    if (scope === 'property' && f.property && e.propertyId !== f.property) return false;
    if (f.category && e.category !== f.category) return false;
    if (f.search) {
      var q = f.search.toLowerCase();
      var hay = (e.description + ' ' + e.vendorName + ' ' + e.category + ' ' + e.notes + ' ' + propertyName(e.propertyId)).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function expenseFilterBar(scope) {
  var f = UI.expFilter;
  var cats = scope === 'business' ? S.businessCategories : S.expenseCategories;
  var any = f.property || f.category || f.search || f.from || f.to;
  return '<div class="tbl-toolbar no-print">' +
    searchBox('expSearch', f.search, 'Search description, vendor or category…') +
    (scope === 'property' ? '<select class="sel" data-expfilter="property" style="width:auto;min-width:150px">' + propertyOptions(f.property) + '</select>' : '') +
    '<select class="sel" data-expfilter="category" style="width:auto;min-width:150px"><option value="">All categories</option>' + optionsFrom(cats, f.category, false) + '</select>' +
    '<input type="date" class="inp" data-expfilter="from" value="' + attr(f.from) + '" aria-label="From date" style="width:auto">' +
    '<input type="date" class="inp" data-expfilter="to" value="' + attr(f.to) + '" aria-label="To date" style="width:auto">' +

function viewMaintenance() {
  var r = currentRange();
  var f = UI.maintFilter;
  var stats = maintenanceStats(r);
  var aging = maintenanceAging();
  var unlinked = maintenanceNotInExpenses();

  if (!S.maintenance.length) {
    return '<section class="card">' + emptyState({
      icon: 'wrench', title: 'No maintenance issues',
      body: 'Nothing needs attention right now. Add a record when something is reported so you keep a full repair history for each property.',
      actions: '<button class="btn btn-primary" data-act="new-maint">' + ico('plus') + 'Add maintenance record</button>' +
        (S.vendors.length ? '' : '<button class="btn" data-act="new-vendor">' + ico('plus') + 'Add a contractor</button>')
    }) + '</section>';
  }

  var list = S.maintenance.filter(function (m) {
    if (f.property && m.propertyId !== f.property) return false;
    if (f.status === 'open' && !isMaintOpen(m.status)) return false;
    else if (f.status && f.status !== 'open' && m.status !== f.status) return false;
    if (f.priority && m.priority !== f.priority) return false;
    if (f.category && m.category !== f.category) return false;
    if (f.search) {
      var q = f.search.toLowerCase();
      var hay = (m.title + ' ' + m.description + ' ' + m.notes + ' ' + m.reportedBy + ' ' + propertyName(m.propertyId) + ' ' + vendorName(m.vendorId)).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  var h = '<div class="stack">';
  h += '<div class="grid g-kpi">' +
    kpi({ label: 'Open requests', value: nfmt(stats.open), accent: stats.open ? 'sand' : 'sage', footHtml: stats.urgent ? '<span class="neg">' + stats.urgent + ' urgent</span>' : 'Nothing urgent' }) +
    kpi({ label: 'Completed', value: nfmt(stats.completed), footHtml: esc('In ' + (r.label || 'this period')) }) +
    kpi({ label: 'Maintenance spend', value: money(stats.spend), accent: 'terra', tip: 'Repairs and maintenance recorded as expenses in this period.', footHtml: 'Recorded as expenses' }) +
    kpi({ label: 'Average repair cost', value: money(stats.avgCost), footHtml: 'Across all jobs with a cost' }) +
    '</div>';

  if (unlinked.length) {
    h += flagRow({
      kind: 'warn', icon: 'info',
      text: '<strong>' + unlinked.length + '</strong> completed ' + plural(unlinked.length, 'job') + ' ' + (unlinked.length === 1 ? 'has' : 'have') + ' a cost of <strong>' +
        money(sum(unlinked, function (m) { return m.actualCost; })) + '</strong> that has not been added to property expenses yet, so it is not in your profit & loss.',
      action: { label: 'Review', act: 'maint-unlinked' }
    });
  }

  h += '<div class="grid g-6040">';
  h += card('How long issues have been open', '<div class="aging">' + aging.map(function (b, i) {
    var maxN = Math.max.apply(null, aging.map(function (x) { return x.items.length; })) || 1;
    var cols = ['var(--sage)', 'var(--sand)', 'var(--terra)'];
    return '<div class="age-row"><span class="lbl">' + esc(b.label) + '</span>' +
      '<span class="tr"><i style="width:' + (b.items.length / maxN * 100).toFixed(1) + '%;background:' + cols[i] + '"></i></span>' +
      '<span class="amt">' + b.items.length + ' ' + esc(plural(b.items.length, 'issue')) + '</span></div>';
  }).join('') + '</div>' +
    (aging[2].items.length ? '<div class="flag" style="margin-top:13px">' + ico('clock') + '<span class="grow"><strong>' + aging[2].items.length + '</strong> maintenance ' + plural(aging[2].items.length, 'issue') + ' ' + (aging[2].items.length === 1 ? 'has' : 'have') + ' been open longer than 30 days.</span></div>' : ''),
    { hint: 'Open issues only' });

  var byCat = groupBy(S.maintenance.filter(function (m) { return num(m.actualCost) > 0; }), function (m) { return m.category; });
  h += card('Cost by category', chartDonut(byCat.keys.map(function (k) {
    return { name: k, value: round2(sum(byCat.map[k], function (m) { return m.actualCost; })) };
  }).sort(function (a, b) { return b.value - a.value; }), 'recorded', moneyShort(sum(S.maintenance, function (m) { return m.actualCost; }))));
  h += '</div>';

  h += '<section class="card">' +
    '<div class="tbl-toolbar no-print">' +
      searchBox('maintSearch', f.search, 'Search issues, vendors or notes…') +
      '<select class="sel" data-maintfilter="property" style="width:auto;min-width:150px">' + propertyOptions(f.property) + '</select>' +
      '<select class="sel" data-maintfilter="status" style="width:auto;min-width:130px">' +
        '<option value=""' + (f.status === '' ? ' selected' : '') + '>All statuses</option>' +
        '<option value="open"' + (f.status === 'open' ? ' selected' : '') + '>Open only</option>' +
        MAINT_STATUSES.map(function (s) { return '<option value="' + s.id + '"' + (f.status === s.id ? ' selected' : '') + '>' + esc(s.label) + '</option>'; }).join('') +
      '</select>' +
      '<select class="sel" data-maintfilter="priority" style="width:auto;min-width:120px"><option value="">Any priority</option>' +
        MAINT_PRIORITIES.map(function (p) { return '<option value="' + p.id + '"' + (f.priority === p.id ? ' selected' : '') + '>' + esc(p.label) + '</option>'; }).join('') + '</select>' +
      '<select class="sel" data-maintfilter="category" style="width:auto;min-width:140px"><option value="">All categories</option>' +
        optionsFrom(S.maintCategories, f.category, false) + '</select>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn-sm" data-act="export-maint">' + ico('download') + 'Export CSV</button>' +
      '<button class="btn btn-sm btn-primary" data-act="new-maint">' + ico('plus') + 'Add record</button>' +
    '</div>';
  if (!list.length) {
    h += emptyState({
      icon: 'check', small: true, title: 'Nothing matches those filters',
      body: 'Try showing all statuses, or clear the filters to see the full maintenance history.',
      actions: '<button class="btn" data-act="maint-clear">Clear filters</button>'
    });
  } else {
    h += maintTable(sortBy(list, function (m) { return m.reportedDate; }, 'desc'), 'maintlist');
  }
  h += '</section>';

  h += vendorPanel();
  h += '</div>';
  return h;
}

function maintTable(list, tableId) {
  sortState(tableId, 'reportedDate', 'desc');
  var sorted = applySort(list, tableId, {
    reportedDate: function (x) { return x.reportedDate; },
    title: function (x) { return x.title; },
    property: function (x) { return propertyName(x.propertyId); },
    priority: function (x) { return maintPriorityMeta(x.priority).rank; },
    status: function (x) { return x.status; },
    cost: function (x) { return num(x.actualCost) || num(x.estCost); },
    age: function (x) { return x.reportedDate; }
  });
  var rows = pageSlice(sorted, tableId);
  var h = '<div class="table-wrap"><table class="tbl"><thead><tr>' +
    sortTh(tableId, 'title', 'Issue') +
    sortTh(tableId, 'property', 'Property') +
    sortTh(tableId, 'reportedDate', 'Reported') +
    sortTh(tableId, 'priority', 'Priority') +
    sortTh(tableId, 'status', 'Status') +
    '<th scope="col">Vendor</th>' +
    sortTh(tableId, 'cost', 'Cost', 'r') +
    '<th></th></tr></thead><tbody>';
  rows.forEach(function (m) {
    var age = daysSince(m.reportedDate);
    var open = isMaintOpen(m.status);
    h += '<tr>' +
      '<td><button class="linkish" data-act="edit-maint" data-id="' + attr(m.id) + '">' + esc(m.title) + '</button>' +
        '<div class="cell-sub">' + esc(m.category) + (m.unitId ? ' · ' + esc(unitName(m.unitId)) : '') + '</div></td>' +
      '<td>' + esc(propertyName(m.propertyId)) + '</td>' +
      '<td class="n">' + esc(fmtDate(m.reportedDate)) +
        (open && age !== null ? '<div class="cell-sub' + (age > 30 ? ' neg' : '') + '">open ' + age + ' ' + plural(age, 'day') + '</div>' : '') + '</td>' +
      '<td>' + priorityBadge(m.priority) + '</td>' +
      '<td>' + maintBadge(m.status) + '</td>' +
      '<td>' + (m.vendorId ? esc(vendorName(m.vendorId)) : '<span class="muted">—</span>') + '</td>' +
      '<td class="r n">' + (num(m.actualCost) > 0
        ? money(m.actualCost) + (m.expenseId ? '<div class="cell-sub">in expenses</div>' : '<div class="cell-sub neg">not in expenses</div>')
        : (num(m.estCost) > 0 ? '<span class="muted">est. ' + money(m.estCost) + '</span>' : '<span class="muted">—</span>')) + '</td>' +
      '<td class="r"><div class="rowact">' +
        (num(m.actualCost) > 0 && !m.expenseId ? '<button class="icon-btn good" data-act="maint-to-expense" data-id="' + attr(m.id) + '" title="Add cost to property expenses" aria-label="Add cost to property expenses">' + ico('receipt') + '</button>' : '') +
        '<button class="icon-btn" data-act="edit-maint" data-id="' + attr(m.id) + '" title="Edit" aria-label="Edit">' + ico('edit') + '</button>' +
        '<button class="icon-btn danger" data-act="delete-maint" data-id="' + attr(m.id) + '" title="Delete" aria-label="Delete">' + ico('trash') + '</button>' +
      '</div></td></tr>';
  });
  h += '</tbody></table></div>' + pagerBar(sorted.length, tableId, 'record');
  return h;
}

function tenantsTab() {
  var f = UI.tenantFilter;
  /* Outstanding balances are worked out once for the whole portfolio rather
     than re-scanning every lease inside the row loop. */
  var owedByLease = {};
  obligationsInRange({ from: '1900-01-01', to: todayISO() }).forEach(function (o) {
    if (o.balance > EPS) owedByLease[o.leaseId] = round2((owedByLease[o.leaseId] || 0) + o.balance);
  });

  var list = S.tenants.filter(function (t) {
    var leases = leasesOfTenant(t.id);
    var active = leases.some(leaseIsActive);
    var upcoming = leases.some(leaseIsFuture);
    var ending = leases.some(function (l) { var d = l.end && leaseIsActive(l) ? daysUntil(l.end) : null; return d !== null && d >= 0 && d <= 60; });
    if (f.status === 'active' && !active) return false;
    if (f.status === 'former' && (active || upcoming)) return false;
    if (f.status === 'ending' && !ending) return false;
    if (f.search) {
      var q = f.search.toLowerCase();
      var hay = (t.name + ' ' + t.email + ' ' + t.phone + ' ' + t.notes + ' ' + leases.map(function (l) { return unitFullName(l.unitId); }).join(' ')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  var activeCount = S.tenants.filter(function (t) { return leasesOfTenant(t.id).some(leaseIsActive); }).length;
  var h = '<div class="grid g-kpi">' +
    kpi({ label: 'Current tenants', value: nfmt(activeCount), accent: 'sage' }) +
    kpi({ label: 'Active leases', value: nfmt(activeLeases().length), footHtml: esc(S.leases.filter(leaseIsMonthToMonth).filter(leaseIsActive).length + ' month to month') }) +
    kpi({ label: 'Expiring in 60 days', value: nfmt(leasesExpiringWithin(60).length), tone: leasesExpiringWithin(60).length ? 'neg' : '', act: 'go-leases' }) +
    kpi({ label: 'Former tenants', value: nfmt(S.tenants.length - activeCount), footHtml: 'Kept for history' }) +
    '</div>';

  h += '<section class="card">' +
    '<div class="tbl-toolbar no-print">' +
      searchBox('tenantSearch', f.search, 'Search name, email or unit…') +
      '<div class="seg">' +
        ['active', 'ending', 'former', ''].map(function (s) {
          var labels = { active: 'Current', ending: 'Ending soon', former: 'Former', '': 'All' };
          return '<button data-tfilter="' + s + '" class="' + (f.status === s ? 'on' : '') + '">' + labels[s] + '</button>';
        }).join('') +
      '</div>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn-sm" data-act="export-tenants">' + ico('download') + 'Export CSV</button>' +
      '<button class="btn btn-sm btn-primary" data-act="new-tenant">' + ico('plus') + 'Add tenant</button>' +
    '</div>';

  if (!list.length) {
    h += emptyState({ icon: 'users', small: true, title: 'No tenants match', body: 'Try a different filter or clear the search.' });
  } else {
    h += '<div class="table-wrap"><table class="tbl"><thead><tr>' +
      '<th scope="col">Tenant</th><th scope="col">Unit</th><th class="r" scope="col">Rent</th>' +
      '<th scope="col">Lease</th><th class="r" scope="col">Balance</th><th scope="col">Contact</th><th></th></tr></thead><tbody>';
    sortBy(list, function (t) { return leasesOfTenant(t.id).some(leaseIsActive) ? 0 : 1; }, 'asc').forEach(function (t) {
      var leases = sortBy(leasesOfTenant(t.id), function (l) { return l.start; }, 'desc');
      var cur = leases.filter(leaseIsActive)[0] || leases.filter(leaseIsFuture)[0] || leases[0];
      var ls = cur ? leaseState(cur) : null;
      var owed = round2(sum(leases, function (l) { return owedByLease[l.id] || 0; }));
      h += '<tr>' +
        '<td><div class="rowflex" style="gap:9px;flex-wrap:nowrap"><span class="avatar ' + (cur && leaseIsActive(cur) ? 'sage' : '') + '">' + esc(initials(t.name)) + '</span>' +
          '<span style="min-width:0"><span class="cell-main">' + esc(t.name) + '</span>' +
          (t.archived ? ' <span class="badge bd-archived">Former</span>' : '') +
          '<div class="cell-sub">' + esc(leases.length + ' ' + plural(leases.length, 'lease')) + '</div></span></div></td>' +
        '<td>' + (cur ? '<button class="linkish" data-act="open-property" data-id="' + attr(cur.propertyId) + '">' + esc(unitFullName(cur.unitId)) + '</button>' : '<span class="muted">—</span>') + '</td>' +
        '<td class="r n">' + (cur ? money(rentForMonth(cur, thisMonth())) : '<span class="muted">—</span>') + '</td>' +
        '<td>' + (ls ? '<span class="badge ' + ls.cls + '">' + esc(ls.label) + '</span>' : '<span class="muted">—</span>') +
          (cur && cur.end ? '<div class="cell-sub">to ' + esc(fmtDate(cur.end)) + '</div>' : '') + '</td>' +
        '<td class="r n">' + (owed > EPS ? '<strong class="neg">' + money(owed) + '</strong>' : '<span class="muted">' + money(0) + '</span>') + '</td>' +
        '<td>' + (t.email || t.phone ? '<div class="cell-sub" style="margin:0">' + esc(t.email || '') + (t.email && t.phone ? '<br>' : '') + esc(t.phone || '') + '</div>' : '<span class="muted">—</span>') + '</td>' +
        '<td class="r"><div class="rowact">' +
          '<button class="icon-btn" data-act="open-tenant" data-id="' + attr(t.id) + '" title="Open" aria-label="Open tenant">' + ico('eye') + '</button>' +
          '<button class="icon-btn" data-act="edit-tenant" data-id="' + attr(t.id) + '" title="Edit" aria-label="Edit tenant">' + ico('edit') + '</button>' +
          '<button class="icon-btn danger" data-act="delete-tenant" data-id="' + attr(t.id) + '" title="Archive or delete" aria-label="Archive or delete tenant">' + ico('trash') + '</button>' +
        '</div></td></tr>';
    });
    h += '</tbody></table></div>' ;
  }
  h += '</section>';
  h += '<div class="disclaimer">Keep tenant records to what you genuinely need. This tool deliberately does not store identity documents, government ID numbers, bank details or credit information.</div>';
  return h;
}

function leasesTab() {
  var groups = [
    { id: 'ending30', label: 'Expiring within 30 days', test: function (l) { var d = l.end && leaseIsActive(l) ? daysUntil(l.end) : null; return d !== null && d >= 0 && d <= 30; } },
    { id: 'ending60', label: 'Expiring in 31–60 days', test: function (l) { var d = l.end && leaseIsActive(l) ? daysUntil(l.end) : null; return d !== null && d > 30 && d <= 60; } },
    { id: 'ending90', label: 'Expiring in 61–90 days', test: function (l) { var d = l.end && leaseIsActive(l) ? daysUntil(l.end) : null; return d !== null && d > 60 && d <= 90; } },
    { id: 'm2m', label: 'Month to month', test: function (l) { return leaseIsActive(l) && !l.end; } },
    { id: 'active', label: 'Active, expiring later', test: function (l) { var d = l.end && leaseIsActive(l) ? daysUntil(l.end) : null; return d !== null && d > 90; } },
    { id: 'future', label: 'Starting soon', test: leaseIsFuture },
    { id: 'ended', label: 'Ended leases', test: leaseIsEnded }
  ];
  var used = {};
  var h = '<div class="grid g-kpi">' +
    kpi({ label: 'Active leases', value: nfmt(activeLeases().length), accent: 'sage' }) +
    kpi({ label: 'Within 30 days', value: nfmt(leasesExpiringWithin(30).length), tone: leasesExpiringWithin(30).length ? 'neg' : '' }) +
    kpi({ label: 'Within 60 days', value: nfmt(leasesExpiringWithin(60).length), accent: 'sand' }) +
    kpi({ label: 'Within 90 days', value: nfmt(leasesExpiringWithin(90).length), accent: 'blue' }) +
    '</div>';

  var body = '';
  groups.forEach(function (g) {
    var rows = S.leases.filter(function (l) { return !used[l.id] && g.test(l); });
    rows.forEach(function (l) { used[l.id] = 1; });
    if (!rows.length) return;
    body += '<tr class="grouphead"><td colspan="8">' + esc(g.label) + ' · ' + rows.length + '</td></tr>';
    sortBy(rows, function (l) { return l.end || l.start; }, 'asc').forEach(function (l) {
      var ls = leaseState(l);
      body += '<tr>' +
        '<td><span class="cell-main">' + esc(tenantName(l.tenantId)) + '</span><div class="cell-sub">' + esc(unitFullName(l.unitId)) + '</div></td>' +
        '<td class="n">' + esc(fmtDate(l.start)) + '</td>' +
        '<td class="n">' + (l.end ? esc(fmtDate(l.end)) : '<span class="badge bd-m2m">Rolling</span>') + '</td>' +
        '<td class="r n">' + money(rentForMonth(l, thisMonth())) +
          (l.rentSchedule.length > 1 ? '<div class="cell-sub">' + l.rentSchedule.length + ' rent periods</div>' : '') + '</td>' +
        '<td class="c n">' + l.dueDay + '</td>' +
        '<td class="r n">' + (num(l.deposit.amount) > 0 ? money(l.deposit.amount) : '<span class="muted">—</span>') + '</td>' +
        '<td><span class="badge ' + ls.cls + '">' + esc(ls.label) + '</span></td>' +
        '<td class="r"><div class="rowact">' +
          '<button class="icon-btn" data-act="lease-rent" data-id="' + attr(l.id) + '" title="Rent history" aria-label="Rent history">' + ico('cash') + '</button>' +
          '<button class="icon-btn" data-act="edit-lease" data-id="' + attr(l.id) + '" title="Edit" aria-label="Edit lease">' + ico('edit') + '</button>' +
          '<button class="icon-btn danger" data-act="delete-lease" data-id="' + attr(l.id) + '" title="Delete" aria-label="Delete lease">' + ico('trash') + '</button>' +
        '</div></td></tr>';
    });
  });

  h += card('Leases', body
    ? '<div class="table-wrap"><table class="tbl"><thead><tr><th scope="col">Tenant & unit</th><th scope="col">Start</th><th scope="col">End</th>' +
      '<th class="r" scope="col">Current rent</th><th class="c" scope="col">Due day</th><th class="r" scope="col">Deposit</th>' +
      '<th scope="col">Status</th><th></th></tr></thead><tbody>' + body + '</tbody></table></div>'
    : emptyState({
        icon: 'key', title: 'No leases yet',
        body: 'A lease connects a tenant to a unit and holds the rent, the due day and the deposit.',
        actions: '<button class="btn btn-primary" data-act="new-lease">' + ico('plus') + 'Create a lease</button>'
      }),
    {
      flush: !!body,
      hint: 'Grouped by how soon they expire. These are on-screen reminders only — no emails are ever sent.',
      actions: '<button class="btn btn-sm btn-primary" data-act="new-lease">' + ico('plus') + 'New lease</button>'
    });
  return h;
}

function depositsTab() {

  var h = '<div class="grid g-kpi">' +

      '<td>' + esc(unitFullName(l.unitId)) + '</td>' +
      '<td class="r n">' + money(d.amount) + '</td>' +
      '<td class="n">' + (d.receivedDate ? esc(fmtDate(d.receivedDate)) : '<span class="muted">—</span>') + '</td>' +
      '<td class="r n">' + (num(d.returned) > 0 ? money(d.returned) : '<span class="muted">—</span>') + '</td>' +
      '<td class="n">' + (d.returnedDate ? esc(fmtDate(d.returnedDate)) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + depositBadge(d.status) + '</td>' +
      '<td><span class="cell-sub" style="margin:0">' + esc(truncate(d.deductions || '—', 40)) + '</span></td>' +
      '<td class="r"><div class="rowact"><button class="icon-btn" data-act="edit-deposit" data-id="' + attr(l.id) + '" title="Update deposit" aria-label="Update deposit">' + ico('edit') + '</button></div></td></tr>';
  });
  body += '</tbody><tfoot><tr><td colspan="2">Currently held</td><td class="r n">' + money(sumry.held) + '</td>' +
    '<td colspan="6"></td></tr></tfoot></table></div>';

  h += card('Security deposits', body, {
    flush: true,
    hint: 'Deposit tracking only — local rules on holding and returning deposits vary.'
  });
  h += '<div class="disclaimer">This is a record-keeping tool. It does not provide legal conclusions about deposit protection, permitted deductions or return deadlines. Check the rules that apply where your property is located.</div>';
  return h;
}

/* ==========================================================================

   ========================================================================== */
function viewRecords() {
  var f = UI.recFilter;
  if (!S.records.length) {
    return '<section class="card">' + emptyState({
      icon: 'note', title: 'No records yet',
      body: 'Keep the details that are easy to forget — appliance model numbers, boiler servicing, paint colours, access instructions, contractor notes and where each document is stored.',
      actions: '<button class="btn btn-primary" data-act="new-record">' + ico('plus') + 'Add a record</button>'
    }) + '</section>';
  }
  var list = S.records.filter(function (n) {
    if (f.property && n.propertyId !== f.property) return false;
    if (f.category && n.category !== f.category) return false;
    if (f.search) {
      var q = f.search.toLowerCase();
      if ((n.title + ' ' + n.body + ' ' + n.location + ' ' + n.category).toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  });

  var h = '<div class="stack">';
  h += '<section class="card card-pad"><div class="rowflex" style="align-items:flex-start;gap:12px">' +
    '<div class="avatar blue">' + ico('folder') + '</div>' +
    '<div style="flex:1;min-width:0"><h3 style="font-size:15px">Property notes & records</h3>' +
    '<p class="note" style="margin:4px 0 0">This app stores your notes, not your files. Use the "where it is saved" field to point to where a lease, certificate or invoice actually lives — a cloud drive, a folder on your computer or a paper file.</p></div></div></section>';

  h += '<section class="card">' +
    '<div class="tbl-toolbar no-print">' +
      searchBox('recSearch', f.search, 'Search notes…') +

      '<select class="sel" data-recfilter="category" style="width:auto;min-width:150px"><option value="">All categories</option>' + optionsFrom(S.recordCategories, f.category, false) + '</select>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn-sm btn-primary" data-act="new-record">' + ico('plus') + 'Add record</button>' +
    '</div>';
  h += list.length
    ? recordList(sortBy(list, function (n) { return n.date; }, 'desc'))
    : emptyState({ icon: 'note', small: true, title: 'Nothing matches those filters', body: 'Try a different property or category.' });

function recordList(list) {
  return '<div style="padding:4px 0">' + list.map(function (n) {
    return '<div style="padding:15px 22px;border-bottom:1px solid var(--border)">' +
      '<div class="rowflex" style="align-items:flex-start;gap:11px">' +
        '<div style="flex:1;min-width:0">' +

          '<span class="tag">' + esc(n.category) + '</span></div>' +
          '<div class="note" style="margin-top:2px">' + esc(propertyName(n.propertyId)) + (n.unitId ? ' · ' + esc(unitName(n.unitId)) : '') + ' · ' + esc(fmtDate(n.date)) + '</div>' +
          (n.body ? '<div style="font-size:13.5px;line-height:1.6;color:var(--text-2);margin-top:8px;white-space:pre-wrap">' + esc(n.body) + '</div>' : '') +
          (n.location ? '<div class="note rec-loc" style="margin-top:8px;display:flex;gap:6px;align-items:center">' + ico('folder') + '<span>' + esc(n.location) + '</span></div>' : '') +
        '</div>' +
        '<div class="rowflex" style="gap:3px">' +

        '</div>' +
      '</div></div>';
  }).join('') + '</div>';
}

function viewReports() {
  if (!S.properties.length) {
    return '<section class="card">' + emptyState({
      icon: 'chart', title: 'Nothing to report yet',
      body: 'Add a property, record some rent and a few expenses, and your profit & loss, property comparison and cash flow will build themselves.',
      actions: '<button class="btn btn-primary" data-act="new-property">' + ico('plus') + 'Add property</button>' +
        '<button class="btn" data-act="load-sample">' + ico('sparkle') + 'Explore sample portfolio</button>'
    }) + '</section>';
  }
  var tabs = [
    { id: 'pl', label: 'Profit & loss' },
    { id: 'compare', label: 'Property comparison' },
    { id: 'monthly', label: 'Monthly performance' },
    { id: 'cash', label: 'Cash flow' },
    { id: 'business', label: 'Rental business' }
  ];
  var r = currentRange();
  var h = '<div class="stack">';
  h += '<div class="tabs inline no-print">' + tabs.map(function (t) {
    return '<button data-reptab="' + t.id + '" class="' + (UI.reportTab === t.id ? 'on' : '') + '">' + esc(t.label) + '</button>';
  }).join('') + '</div>';

  if (UI.reportTab === 'compare') h += repCompare(r);
  else if (UI.reportTab === 'monthly') h += repMonthly(r);
  else if (UI.reportTab === 'cash') h += repCash(r);
  else if (UI.reportTab === 'business') h += repBusiness(r);
  else h += repPL(r);

  h += '</div>';
  return h;
}

function repPL(r) {
  var scopeId = UI.reportProperty;
  var pl = scopeId ? propertyPL(scopeId, r) : portfolioPL(r);
  var title = scopeId ? propertyName(scopeId) : 'Whole portfolio';

  var h = '<section class="card"><div class="card-head">' +
    '<div><h3>Profit &amp; loss</h3><div class="hint">' + esc(title + ' · ' + (r.label || 'selected period')) + '</div></div>' +
    '<div class="spacer"></div>' +
    '<select class="sel" data-reportprop style="width:auto;min-width:170px">' + propertyOptions(scopeId, 'Whole portfolio') + '</select>' +
    '<button class="btn btn-sm" data-act="show-formulas">' + ico('info') + 'How this is worked out</button>' +
    '<button class="btn btn-sm" data-act="print">' + ico('print') + 'Print</button>' +
    '</div><div class="card-body">';

  h += '<div class="grid g-2"><div>';
  h += '<h3 style="font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">Rental income</h3>';
  h += mrow('Rent collected', pl.rentCollected, { sub: true });
  h += mrow('Other property income', pl.otherIncome, { sub: true });
  h += mrow('Total income', pl.totalIncome, { total: true });

  h += '<h3 style="font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:22px 0 8px">Operating expenses</h3>';
  if (pl.byCategory.length) {
    pl.byCategory.forEach(function (c) { h += mrow(c.name, c.amount, { sub: true }); });
  } else {
    h += '<div class="note" style="padding:6px 0">No operating expenses recorded in this period.</div>';
  }
  h += mrow('Total operating expenses', pl.operatingTotal, { total: true });

  h += '<div style="height:16px"></div>';
  h += mrow('Net operating result', pl.netOperating, { total: true, tone: pl.netOperating >= 0 ? 'pos' : 'neg', tip: 'Total income less operating expenses. Financing costs are deliberately excluded here.' });
  h += '</div><div>';

  /* Cash-flow ladder, clearly separated from the operating result. */
  h += '<h3 style="font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">After financing</h3>';
  h += mrow('Net operating result', pl.netOperating, { sub: true });
  if (!scopeId && pl.businessTotal > EPS) h += mrow('Portfolio business costs', -pl.businessTotal, { sub: true });
  h += mrow(pl.financingIsEstimate ? 'Mortgage payments (estimate)' : 'Financing costs recorded', -pl.financing, { sub: true });
  h += mrow('Estimated cash flow', pl.cashFlow, { total: true, tone: pl.cashFlow >= 0 ? 'pos' : 'neg' });
  h += '<div class="note" style="margin-top:9px">' +
    (pl.financingIsEstimate
      ? 'No financing costs were recorded in this period, so the monthly mortgage estimate saved on the property record has been used. Record a mortgage expense to use real figures instead — the two are never added together.'
      : 'Based on the financing costs you recorded in this period.') + '</div>';

  h += '<div style="height:22px"></div>';
  h += '<div class="summary-strip">' +
    stripCell('Scheduled rent', money(pl.rentScheduled)) +
    stripCell('Collection rate', pctCell(pl.collectionRate)) +
    stripCell('Outstanding', money(pl.rentOutstanding)) +
    stripCell('Maintenance', money(pl.maintenance)) +
    stripCell('Operating margin', pct(pl.margin)) +
    stripCell('Occupancy', pct(pl.occupancy.rate)) +
    '</div>';

  if (pl.byCategory.length) {
    h += '<div style="height:22px"></div>';
    h += chartDonut(pl.byCategory.map(function (c) { return { name: c.name, value: c.amount }; }), 'expenses', moneyShort(pl.operatingTotal));
  }
  h += '</div></div>';
  h += '</div></section>';
  h += '<div class="disclaimer">This summary organises the figures you entered. It is not a tax return, a financial statement or accounting advice. How rental income and costs should be reported depends on your local rules.</div>';
  return h;
}

function repCompare(r) {
  var rows = propertyComparison(r);
  if (!rows.length) return '<section class="card">' + emptyState({ icon: 'chart', title: 'No properties to compare', body: 'Add at least one property to use this report.' }) + '</section>';
  sortState('compare', 'net', 'desc');
  var sorted = applySort(rows, 'compare', {
    name: function (x) { return x.name; },
    rentCollected: function (x) { return x.rentCollected; },
    expenses: function (x) { return x.expenses; },
    maintenance: function (x) { return x.maintenance; },
    net: function (x) { return x.net; },
    occupancy: function (x) { return x.occupancy === null ? -1 : x.occupancy; },
    collectionRate: function (x) { return x.collectionRate === null ? -1 : x.collectionRate; },
    avgRent: function (x) { return x.avgRent; }
  });

function repMonthly(r) {
  var scopeId = UI.reportProperty;
  var series = monthlySeries(r, scopeId, 36);
  if (!series.length) return '<section class="card">' + emptyState({ icon: 'chart', title: 'No months in this range', body: 'Widen the date range to see monthly performance.' }) + '</section>';
  var improving = null;
  if (series.length >= 6) {
    var half = Math.floor(series.length / 2);
    var early = sum(series.slice(0, half), function (m) { return m.net; }) / half;
    var late = sum(series.slice(half), function (m) { return m.net; }) / (series.length - half);
    improving = late - early;
  }

  var body = '<div class="table-wrap"><table class="tbl"><thead><tr>' +
    '<th scope="col">Month</th><th class="r" scope="col">Rent collected</th><th class="r" scope="col">Other income</th>' +
    '<th class="r" scope="col">Expenses</th><th class="r" scope="col">Maintenance</th><th class="r" scope="col">Net income</th></tr></thead><tbody>';
  series.slice().reverse().forEach(function (m) {
    body += '<tr><td class="n">' + esc(m.label) + '</td>' +
      '<td class="r n">' + money(m.collected) + '</td>' +
      '<td class="r n">' + (m.other > EPS ? money(m.other) : '<span class="muted">—</span>') + '</td>' +
      '<td class="r n">' + money(m.expenses) + '</td>' +
      '<td class="r n">' + (m.maintenance > EPS ? money(m.maintenance) : '<span class="muted">—</span>') + '</td>' +
      '<td class="r n"><strong class="' + (m.net >= 0 ? 'pos' : 'neg') + '">' + money(m.net) + '</strong></td></tr>';
  });
  body += '</tbody><tfoot><tr><td>Total</td>' +
    '<td class="r n">' + money(sum(series, function (m) { return m.collected; })) + '</td>' +
    '<td class="r n">' + money(sum(series, function (m) { return m.other; })) + '</td>' +
    '<td class="r n">' + money(sum(series, function (m) { return m.expenses; })) + '</td>' +
    '<td class="r n">' + money(sum(series, function (m) { return m.maintenance; })) + '</td>' +
    '<td class="r n">' + money(sum(series, function (m) { return m.net; })) + '</td></tr></tfoot></table></div>';

  var h = '<section class="card"><div class="card-head">' +
    '<div><h3>Monthly performance</h3><div class="hint">' + esc((scopeId ? propertyName(scopeId) : 'Whole portfolio') + ' · ' + series.length + ' ' + plural(series.length, 'month')) + '</div></div>' +
    '<div class="spacer"></div>' +
    '<select class="sel" data-reportprop style="width:auto;min-width:170px">' + propertyOptions(scopeId, 'Whole portfolio') + '</select>' +
    '<button class="btn btn-sm" data-act="export-monthly">' + ico('download') + 'Export CSV</button>' +
    '</div><div class="card-body">' + chartMonthly(series) +
    (improving !== null ? '<div class="insight i-' + (improving >= 0 ? 'pos' : 'warn') + '" style="margin-top:14px"><div class="ic">' + ico(improving >= 0 ? 'up' : 'down') + '</div>' +
      '<div class="tx">Average monthly net result is <strong>' + money(Math.abs(improving)) + '</strong> ' + (improving >= 0 ? 'higher' : 'lower') + ' in the second half of this range than the first.</div></div>' : '') +
    '</div></section>';
  h += card('Month by month', body, { flush: true });
  return h;
}

      mrow('Property operating expenses', pl.operatingTotal, { sub: true }) +

    '<th scope="col">Property</th><th class="r" scope="col">Income</th><th class="r" scope="col">Expenses</th>' +
    '<th class="r" scope="col">Maintenance</th><th class="r" scope="col">Net income</th></tr></thead><tbody>';
  comp.forEach(function (c) {
    h += '<tr><td>' + esc(c.name) + '</td><td class="r n">' + money(c.income) + '</td>' +
      '<td class="r n">' + money(c.expenses) + '</td><td class="r n">' + money(c.maintenance) + '</td>' +

  h += '</div>';
  return h;

/** Plain-language explanation of every figure the app calculates. */
function showFormulas() {
  var b = '<div class="stack">';
  b += '<div class="formula">' +
    '<b>Rent due for a month</b><br>' +
    'the rent that applied in that month <span class="op">+</span> any adjustments for that month<br>' +
    '<span class="op">The rent that applied comes from the lease\'s rent history, so changing the rent today never rewrites an earlier month.</span></div>';
  b += '<div class="formula">' +
    '<b>Balance</b> <span class="op">=</span> rent due <span class="op">−</span> everything paid towards that month<br>' +
    '<span class="op">A month can be paid in as many instalments as you like. Two payments of 700 and 500 fully settle rent of 1,200.</span></div>';
  b += '<div class="formula">' +
    '<b>Rent status</b><br>' +
    '<b>Paid</b> — balance is zero or less<br>' +
    '<b>Partial</b> — partly paid, still within the due date<br>' +
    '<b>Late</b> — partly paid and past the due date<br>' +
    '<b>Outstanding</b> — nothing paid and past the due date<br>' +
    '<b>Upcoming</b> — nothing paid, due date not reached<br>' +
    '<b>Adjusted</b> — nothing is due after adjustments</div>';
  b += '<div class="formula">' +
    '<b>Rent outstanding</b> <span class="op">=</span> unpaid balances on months that have <b>already passed their due date</b><br>' +
    '<span class="op">Rent for a month that has not fallen due yet is scheduled, not outstanding. A range such as "this year" therefore never reports future rent as owed.</span></div>';
  b += '<div class="formula">' +
    '<b>Collection rate</b> <span class="op">=</span> rent collected <span class="op">÷</span> rent already due <span class="op">×</span> 100<br>' +
    '<span class="op">Only months whose due date has arrived count, and each month is capped at the amount due, so paying next month early cannot push the rate above 100%.</span></div>';
  b += '<div class="formula">' +
    '<b>Total income</b> <span class="op">=</span> rent collected <span class="op">+</span> other property income<br>' +
    '<b>Operating expenses</b> <span class="op">=</span> all recorded property expenses except financing<br>' +
    '<b>Net operating result</b> <span class="op">=</span> total income <span class="op">−</span> operating expenses</div>';
  b += '<div class="formula">' +
    '<b>Estimated cash flow</b> <span class="op">=</span> net operating result <span class="op">−</span> business costs <span class="op">−</span> financing<br>' +
    '<span class="op">Financing means mortgage and loan costs. If you recorded them as expenses, those figures are used. If you did not, the monthly mortgage estimate on the property record is used instead — never both.</span></div>';
  b += '<div class="formula">' +
    '<b>Maintenance costs</b><br>' +
    'expenses linked to a maintenance record, plus expenses in the Repairs and Maintenance categories<br>' +
    '<span class="op">This is a slice of your expenses, not an extra amount on top. A cost recorded on a maintenance job is only counted once it has been added to expenses.</span></div>';
  b += '<div class="formula">' +
    '<b>Occupancy</b> <span class="op">=</span> units with a lease running today <span class="op">÷</span> total units<br>' +
    '<b>Average monthly rent</b> <span class="op">=</span> scheduled rent <span class="op">÷</span> months in range <span class="op">÷</span> units</div>';
  b += '<div class="formula">' +
    '<b>Deposits</b> are tracked separately and are never counted as rental income.<br>' +
    '<b>Recurring costs</b> are templates. They are projections only and are never included in a report until you record them.</div>';
  b += '<div class="disclaimer">These calculations organise the figures you entered. They are not accounting output and do not constitute tax, legal or financial advice.</div>';
  b += '</div>';

  openModal(modalShell({
    title: 'How figures are worked out',
    sub: 'Every calculation in the app, in plain language',
    body: b,
    foot: '<span class="spacer"></span><button class="btn btn-primary" data-x>Close</button>'
  }));
  bindModalClose();
}
