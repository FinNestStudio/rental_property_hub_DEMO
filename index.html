   29. MODALS — properties, units, tenants & leases
   ========================================================================== */
function bindModalClose() {
  var ov = modalStack[modalStack.length - 1];
  if (!ov) return ov;
  ov.querySelectorAll('[data-x]').forEach(function (b) { b.addEventListener('click', closeModal); });
  return ov;
}
function requireText(ov, id, label) {
  var v = readVal(ov, id).trim();
  markInvalid(ov, id, !v);
  if (!v) { toast(label + ' is required.', 'err'); var el = ov.querySelector('#' + id); if (el) el.focus(); }
  return v;
}

/* --- property ------------------------------------------------------------- */
function openPropertyModal(id) {
  var p = id ? getProperty(id) : null;
  var isNew = !p;
  if (!p) p = normProperty({ name: '', ownershipPct: 100 });

  var body = '<div class="stack">' +
    '<div class="fieldset plain"><div class="lg">' + ico('home') + 'Property details</div><div class="form-grid two">' +
      fText('pName', 'Property name', p.name, { placeholder: 'Oak Street House', span: true }) +
      fText('pAddress', 'Address or nickname', p.address, { placeholder: '14 Oak Street', span: true }) +
      fSelect('pType', 'Property type', optionsFrom(S.propertyTypes, p.type, 'Not set')) +
      fDate('pPurchase', 'Purchase date (optional)', p.purchaseDate) +
    '</div></div>' +
    '<div class="fieldset"><div class="lg">' + ico('bank') + 'Optional financial details</div>' +
      '<p class="note" style="margin:-4px 0 12px">These are reference estimates. They are shown on the property page and used for the cash-flow estimate only when you have not recorded real financing costs. They are never added to your expenses.</p>' +
      '<div class="form-grid">' +
      fMoney('pPrice', 'Purchase price', p.purchasePrice) +
      fText('pOwn', 'Ownership %', p.ownershipPct, { type: 'number', min: 0, step: '0.01' }) +
      fMoney('pMortgage', 'Monthly mortgage payment', p.mortgage) +
      fMoney('pTax', 'Property tax per year', p.propertyTaxAnnual) +
      fMoney('pIns', 'Insurance per year', p.insuranceAnnual) +
      fMoney('pOther', 'Other monthly costs', p.otherMonthly) +
    '</div></div>' +
    '<div class="form-grid">' + fArea('pNotes', 'Notes', p.notes, { placeholder: 'Anything worth remembering about this property…' }) + '</div>' +
    '</div>';

  var ov = openModal(modalShell({
    title: isNew ? 'Add property' : 'Edit property',
    sub: isNew ? 'Only the name is required — you can fill in the rest later' : p.name,
    body: body,
    foot: (isNew ? '' : '<button class="btn btn-danger" data-del>' + ico('trash') + 'Delete</button>' +
      '<button class="btn" data-arch>' + (p.archived ? 'Restore' : 'Archive') + '</button>') +
      '<span class="spacer"></span><button class="btn btn-ghost" data-x>Cancel</button>' +
      '<button class="btn btn-primary" data-save>' + (isNew ? 'Add property' : 'Save changes') + '</button>'
  }));
  bindModalClose();
  var nameEl = ov.querySelector('#pName'); if (nameEl) setTimeout(function () { nameEl.focus(); }, 40);

  ov.querySelector('[data-save]').addEventListener('click', function () {
    var name = requireText(ov, 'pName', 'Property name');
    if (!name) return;
    var rec = normProperty({
      id: p.id, name: name, address: readVal(ov, 'pAddress'), type: readVal(ov, 'pType'),
      purchaseDate: readVal(ov, 'pPurchase'), purchasePrice: readNum(ov, 'pPrice'),
      ownershipPct: readVal(ov, 'pOwn'), mortgage: readNum(ov, 'pMortgage'),
      propertyTaxAnnual: readNum(ov, 'pTax'), insuranceAnnual: readNum(ov, 'pIns'),
      otherMonthly: readNum(ov, 'pOther'), notes: readVal(ov, 'pNotes'),
      archived: p.archived, createdAt: p.createdAt
    });
    closeModal();
    commit(function () {
      if (isNew) S.properties.push(rec);
      else S.properties = S.properties.map(function (x) { return x.id === rec.id ? rec : x; });
    }, isNew ? 'Property added.' : 'Property updated.');
    if (isNew) { UI.propertyId = rec.id; UI.propTab = 'units'; go('property'); openUnitModal(null, rec.id); }
  });

  if (!isNew) {
    ov.querySelector('[data-arch]').addEventListener('click', function () {
      closeModal();
      commit(function () {
        var t = getProperty(p.id); if (t) t.archived = !t.archived;
      }, p.archived ? 'Property restored.' : 'Property archived. It stays in your reports and history.');
    });
    ov.querySelector('[data-del]').addEventListener('click', function () {
      closeModal();
      deleteProperty(p.id);
    });
  }
}

function deleteProperty(id) {
  var p = getProperty(id);
  if (!p) return;
  var units = unitsOf(id, true);
  var leases = S.leases.filter(function (l) { return l.propertyId === id; });
  var pays = S.payments.filter(function (x) { return x.propertyId === id; });
  var exps = S.expenses.filter(function (x) { return x.propertyId === id; });
  var maint = S.maintenance.filter(function (x) { return x.propertyId === id; });
  var related = units.length + leases.length + pays.length + exps.length + maint.length;

  confirmDialog({
    title: 'Delete ' + p.name + '?',
    danger: true,
    okLabel: related ? 'Delete property and its records' : 'Delete property',
    bodyHtml: related
      ? '<p>This property has related records that will also be permanently deleted:</p>' +
        '<ul style="margin:10px 0 12px 18px;padding:0;line-height:1.8">' +
        (units.length ? '<li>' + units.length + ' ' + plural(units.length, 'unit') + '</li>' : '') +
        (leases.length ? '<li>' + leases.length + ' ' + plural(leases.length, 'lease') + '</li>' : '') +
        (pays.length ? '<li>' + pays.length + ' rent ' + plural(pays.length, 'payment') + '</li>' : '') +
        (exps.length ? '<li>' + exps.length + ' ' + plural(exps.length, 'expense') + '</li>' : '') +
        (maint.length ? '<li>' + maint.length + ' maintenance ' + plural(maint.length, 'record') + '</li>' : '') +
        '</ul><p><strong>Archiving instead</strong> keeps every figure in your reports and history. Deleting removes them for good.</p>'
      : '<p>This property has no other records attached. It will be removed permanently.</p>',
    onConfirm: function () {
      commit(function () {
        var unitIds = {};
        S.units.filter(function (u) { return u.propertyId === id; }).forEach(function (u) { unitIds[u.id] = 1; });
        var leaseIds = {};
        S.leases.filter(function (l) { return l.propertyId === id; }).forEach(function (l) { leaseIds[l.id] = 1; });
        S.properties = S.properties.filter(function (x) { return x.id !== id; });
        S.units = S.units.filter(function (x) { return x.propertyId !== id; });
        S.leases = S.leases.filter(function (x) { return x.propertyId !== id; });
        S.payments = S.payments.filter(function (x) { return !leaseIds[x.leaseId] && x.propertyId !== id; });
        S.adjustments = S.adjustments.filter(function (x) { return !leaseIds[x.leaseId] && x.propertyId !== id; });
        S.income = S.income.filter(function (x) { return x.propertyId !== id; });
        S.expenses = S.expenses.filter(function (x) { return x.propertyId !== id; });
        S.maintenance = S.maintenance.filter(function (x) { return x.propertyId !== id; });
        S.recurring = S.recurring.filter(function (x) { return x.propertyId !== id; });
        S.mileage = S.mileage.filter(function (x) { return x.propertyId !== id; });
        S.records = S.records.filter(function (x) { return x.propertyId !== id; });
        if (UI.propertyId === id) { UI.propertyId = ''; UI.view = 'properties'; }
      }, 'Property deleted.', 'delete property');
    }
  });
}

/* --- unit ----------------------------------------------------------------- */
function openUnitModal(id, propertyId) {
  var u = id ? getUnit(id) : null;
  var isNew = !u;
  if (!u) u = normUnit({ propertyId: propertyId || UI.propertyId, dueDay: S.settings.defaultDueDay, status: 'vacant' });

  var body = '<div class="form-grid two">' +
    fSelect('uProperty', 'Property', propertyOptions(u.propertyId, 'Choose a property'), { span: true }) +
    fText('uName', 'Unit name or number', u.name, { placeholder: 'Unit 1A, Main house, Room 2' }) +
    fSelect('uStatus', 'Status', optionsFrom(UNIT_STATUSES, u.status, false),
      { help: 'A unit with a lease running today shows as occupied automatically.' }) +
    fText('uBeds', 'Bedrooms (optional)', u.beds, { type: 'number', min: 0 }) +
    fText('uBaths', 'Bathrooms (optional)', u.baths, { type: 'number', min: 0, step: '0.5' }) +
    fMoney('uRent', 'Monthly rent', u.rent, { help: 'The asking rent. Actual rent charged comes from the lease.' }) +
    fMoney('uDeposit', 'Deposit', u.deposit) +
    fText('uDueDay', 'Rent due day', u.dueDay, { type: 'number', min: 1, help: 'Day of the month, 1 to 31. Short months use the last day.' }) +
    fArea('uNotes', 'Notes', u.notes) +
    '</div>';

  var ov = openModal(modalShell({
    title: isNew ? 'Add unit' : 'Edit unit',
    sub: isNew ? 'A single house or flat is simply one unit' : unitFullName(u.id),
    body: body,
    foot: (isNew ? '' : '<button class="btn btn-danger" data-del>' + ico('trash') + 'Delete</button>') +
      '<span class="spacer"></span><button class="btn btn-ghost" data-x>Cancel</button>' +
      (isNew ? '<button class="btn" data-savenew>Save &amp; add another</button>' : '') +
      '<button class="btn btn-primary" data-save>' + (isNew ? 'Add unit' : 'Save changes') + '</button>'
  }));
  bindModalClose();
  var nameEl = ov.querySelector('#uName'); if (nameEl) setTimeout(function () { nameEl.focus(); }, 40);

  function build() {
    var name = requireText(ov, 'uName', 'Unit name');
    if (!name) return null;
    var pid = readVal(ov, 'uProperty');
    if (!pid) { markInvalid(ov, 'uProperty', true); toast('Choose which property this unit belongs to.', 'err'); return null; }
    return normUnit({
      id: u.id, propertyId: pid, name: name,
      beds: readVal(ov, 'uBeds'), baths: readVal(ov, 'uBaths'),
      rent: readNum(ov, 'uRent'), deposit: readNum(ov, 'uDeposit'),
      dueDay: readNum(ov, 'uDueDay') || 1, status: readVal(ov, 'uStatus'),
      notes: readVal(ov, 'uNotes'), archived: u.archived, createdAt: u.createdAt
    });
  }
  function persist(rec) {
    commit(function () {
      if (isNew) S.units.push(rec);
      else S.units = S.units.map(function (x) { return x.id === rec.id ? rec : x; });
    }, isNew ? 'Unit added.' : 'Unit updated.');
  }
  ov.querySelector('[data-save]').addEventListener('click', function () {
    var rec = build(); if (!rec) return;
    closeModal(); persist(rec);
  });
  if (isNew) {
    ov.querySelector('[data-savenew]').addEventListener('click', function () {
      var rec = build(); if (!rec) return;
      var pid = rec.propertyId;
      closeModal(); persist(rec); openUnitModal(null, pid);
    });
  } else {
    ov.querySelector('[data-del]').addEventListener('click', function () {
      closeModal();
      var leases = leasesOfUnit(u.id);
      confirmDialog({
        title: 'Delete ' + u.name + '?',
        danger: true, okLabel: 'Delete unit',
        bodyHtml: leases.length
          ? '<p>This unit has <strong>' + leases.length + ' ' + plural(leases.length, 'lease') + '</strong>. Deleting it will also delete those leases and every rent payment recorded against them.</p><p>Your reports for past periods will change.</p>'
          : '<p>This unit has no leases attached and will be removed permanently.</p>',
        onConfirm: function () {
          commit(function () {
            var leaseIds = {};
            S.leases.filter(function (l) { return l.unitId === u.id; }).forEach(function (l) { leaseIds[l.id] = 1; });
            S.units = S.units.filter(function (x) { return x.id !== u.id; });
            S.leases = S.leases.filter(function (x) { return x.unitId !== u.id; });
            S.payments = S.payments.filter(function (x) { return !leaseIds[x.leaseId]; });
            S.adjustments = S.adjustments.filter(function (x) { return !leaseIds[x.leaseId]; });
          }, 'Unit deleted.', 'delete unit');
        }
      });
    });
  }
}

/* --- tenant --------------------------------------------------------------- */
function openTenantModal(id) {
  var t = id ? getTenant(id) : null;
  var isNew = !t;
  if (!t) t = normTenant({ name: '' });

  var body = '<div class="stack">' +
    '<div class="form-grid two">' +
      fText('tName', 'Tenant name', t.name, { placeholder: 'Full name', span: true }) +
      fText('tEmail', 'Email (optional)', t.email, { type: 'email' }) +
      fText('tPhone', 'Phone (optional)', t.phone) +
      fArea('tNotes', 'Notes', t.notes, { placeholder: 'Preferred contact method, emergency contact, anything useful…' }) +
    '</div>' +
    '<div class="disclaimer">' + ico('shield') + ' Keep tenant records to what you genuinely need. This app deliberately has no fields for identity documents, government ID numbers, bank details or credit information.</div>' +
    '</div>';

  var ov = openModal(modalShell({
    title: isNew ? 'Add tenant' : 'Edit tenant',
    sub: isNew ? 'You can create their lease straight afterwards' : t.name,
    body: body,
    foot: (isNew ? '' : '<button class="btn btn-danger" data-del>' + ico('trash') + 'Archive or delete</button>') +
      '<span class="spacer"></span><button class="btn btn-ghost" data-x>Cancel</button>' +
      '<button class="btn btn-primary" data-save>' + (isNew ? 'Add tenant' : 'Save changes') + '</button>'
  }));
  bindModalClose();
  var el = ov.querySelector('#tName'); if (el) setTimeout(function () { el.focus(); }, 40);

  ov.querySelector('[data-save]').addEventListener('click', function () {
    var name = requireText(ov, 'tName', 'Tenant name');
    if (!name) return;
    var rec = normTenant({
      id: t.id, name: name, email: readVal(ov, 'tEmail'), phone: readVal(ov, 'tPhone'),
      notes: readVal(ov, 'tNotes'), archived: t.archived, createdAt: t.createdAt
    });
    closeModal();
    commit(function () {
      if (isNew) S.tenants.push(rec);
      else S.tenants = S.tenants.map(function (x) { return x.id === rec.id ? rec : x; });
    }, isNew ? 'Tenant added.' : 'Tenant updated.');
    if (isNew && S.units.length) openLeaseModal(null, '', rec.id);
  });
  if (!isNew) {
    ov.querySelector('[data-del]').addEventListener('click', function () { closeModal(); deleteTenant(t.id); });
  }
}

function deleteTenant(id) {
  var t = getTenant(id);
  if (!t) return;
  var leases = leasesOfTenant(id);
  var pays = S.payments.filter(function (p) { return p.tenantId === id; });
  var ov = openModal(modalShell({
    narrow: true,
    title: 'Archive or delete ' + t.name + '?',
    body: '<div class="stack">' +
      (leases.length
        ? '<p style="font-size:13.5px;line-height:1.6;color:var(--text-2)">This tenant has <strong>' + leases.length + ' ' + plural(leases.length, 'lease') + '</strong> and <strong>' + pays.length + ' rent ' + plural(pays.length, 'payment') + '</strong> recorded.</p>'
        : '<p style="font-size:13.5px;line-height:1.6;color:var(--text-2)">This tenant has no leases attached.</p>') +
      '<div class="fieldset"><div class="lg">' + ico('archive') + 'Archive (recommended)</div>' +
        '<p class="note">Marks them as a former tenant. Every past payment, lease and report stays exactly as it is.</p></div>' +
      '<div class="fieldset"><div class="lg">' + ico('trash') + 'Delete permanently</div>' +
        '<p class="note">Removes the tenant, their leases and their rent payments. Historical reports will change.</p></div>' +
    '</div>',
    foot: '<button class="btn btn-danger" data-hard>Delete permanently</button><span class="spacer"></span>' +
      '<button class="btn btn-ghost" data-x>Cancel</button>' +
      '<button class="btn btn-primary" data-arch data-autofocus>' + (t.archived ? 'Restore tenant' : 'Archive tenant') + '</button>'
  }));
  bindModalClose();
  ov.querySelector('[data-arch]').addEventListener('click', function () {
    closeModal();
    commit(function () { var x = getTenant(id); if (x) x.archived = !x.archived; },
      t.archived ? 'Tenant restored.' : 'Tenant archived. Their history is unchanged.');
  });
  ov.querySelector('[data-hard]').addEventListener('click', function () {
    closeModal();
    confirmDialog({
      title: 'Permanently delete ' + t.name + '?',
      danger: true, okLabel: 'Delete everything',
      body: 'This removes the tenant, their leases and every rent payment recorded against them. Reports covering those periods will change. This cannot be undone once you leave the page.',
      onConfirm: function () {
        commit(function () {
          var leaseIds = {};
          S.leases.filter(function (l) { return l.tenantId === id; }).forEach(function (l) { leaseIds[l.id] = 1; });
          S.tenants = S.tenants.filter(function (x) { return x.id !== id; });
          S.leases = S.leases.filter(function (x) { return x.tenantId !== id; });
          S.payments = S.payments.filter(function (x) { return !leaseIds[x.leaseId]; });
          S.adjustments = S.adjustments.filter(function (x) { return !leaseIds[x.leaseId]; });
        }, 'Tenant deleted.', 'delete tenant');
      }
    });
  });
}

/* --- lease ---------------------------------------------------------------- */
function leaseUnitOptions(selected) {
  var h = '<option value="">Choose a unit</option>';
  activeProperties().forEach(function (p) {
    var units = unitsOf(p.id);
    if (!units.length) return;
    h += '<optgroup label="' + attr(p.name) + '">';
    units.forEach(function (u) {
      var cur = currentLeaseOf(u.id);
      h += '<option value="' + attr(u.id) + '"' + (selected === u.id ? ' selected' : '') + '>' +
        esc(u.name) + (cur && cur.unitId === u.id ? ' — currently let to ' + esc(tenantName(cur.tenantId)) : ' — vacant') + '</option>';
    });
    h += '</optgroup>';
  });
  return h;
}
function tenantSelectOptions(selected) {
  var h = '<option value="">Choose a tenant</option>';
  S.tenants.filter(function (t) { return !t.archived; }).forEach(function (t) {
    h += '<option value="' + attr(t.id) + '"' + (selected === t.id ? ' selected' : '') + '>' + esc(t.name) + '</option>';
  });
  var arch = S.tenants.filter(function (t) { return t.archived; });
  if (arch.length) {
    h += '<optgroup label="Former tenants">' + arch.map(function (t) {
      return '<option value="' + attr(t.id) + '"' + (selected === t.id ? ' selected' : '') + '>' + esc(t.name) + '</option>';
    }).join('') + '</optgroup>';
  }
  return h;
}

function openLeaseModal(id, unitId, tenantId) {
  if (!S.units.length) {
    toast('Add a property with at least one unit before creating a lease.', 'err');
    return;
  }
  if (!S.tenants.length && !tenantId) {
    toast('Add a tenant first — then create their lease.', 'err');
    openTenantModal();
    return;
  }
  var l = id ? getLease(id) : null;
  var isNew = !l;
  var seedUnit = unitId || (l && l.unitId) || '';
  var u = getUnit(seedUnit);
  if (!l) {
    l = normLease({
      unitId: seedUnit, tenantId: tenantId || '',
      start: todayISO(), dueDay: (u && u.dueDay) || S.settings.defaultDueDay,
      rentSchedule: [{ from: thisMonth(), amount: u ? u.rent : 0 }],
      deposit: { amount: u ? u.deposit : 0, receivedDate: '', status: 'held' }
    });
  }
  var currentRent = rentForMonth(l, thisMonth());

  var body = '<div class="stack">' +
    '<div class="fieldset plain"><div class="lg">' + ico('key') + 'Lease</div><div class="form-grid two">' +
      fSelect('lUnit', 'Unit', leaseUnitOptions(l.unitId), { span: true }) +
      fSelect('lTenant', 'Tenant', tenantSelectOptions(l.tenantId), { span: true }) +
      fDate('lStart', 'Lease start', l.start) +
      fDate('lEnd', 'Lease end', l.end, { help: 'Leave empty for a rolling month-to-month agreement.' }) +
      fMoney('lRent', 'Monthly rent', currentRent, {
        help: isNew ? 'The rent charged from the lease start.' : 'Changing this records a rent change from ' + fmtMonthLong(thisMonth()) + '. Earlier months keep the rent that applied then.'
      }) +
      fText('lDueDay', 'Rent due day', l.dueDay, { type: 'number', min: 1 }) +
    '</div>' +
    fSwitch('lProrate', 'Charge a part-month pro rata at the start and end', l.prorate,
      'When on, a lease that begins or ends mid-month is charged by the number of days covered. Off by default so figures stay predictable.') +
    '</div>' +
    '<div class="fieldset"><div class="lg">' + ico('shield') + 'Security deposit</div><div class="form-grid">' +
      fMoney('lDep', 'Deposit amount', l.deposit.amount) +
      fDate('lDepDate', 'Date received', l.deposit.receivedDate) +
      fSelect('lDepStatus', 'Status', optionsFrom(DEPOSIT_STATUSES, l.deposit.status, false)) +
    '</div><div class="note" style="margin-top:9px">Deposit tracking only — local rules may vary.</div></div>' +
    '<div class="fieldset"><div class="lg">' + ico('calendar') + 'Move in &amp; move out</div><div class="form-grid">' +
      fDate('lMoveIn', 'Move-in date', l.moveIn) +
      fDate('lMoveOut', 'Move-out date', l.moveOut, { help: 'Setting this stops rent being charged after that date.' }) +
    '</div></div>' +
    '<div class="form-grid">' + fArea('lNotes', 'Notes', l.notes) + '</div>' +
    (isNew || l.rentSchedule.length < 2 ? '' :
      '<div class="fieldset"><div class="lg">' + ico('clock') + 'Rent history</div>' +
      l.rentSchedule.map(function (e) {
        return '<div class="moneyrow"><span class="k">From ' + esc(fmtMonthLong(e.from)) + '</span><span class="v">' + money(e.amount) + '</span></div>';
      }).join('') +
      '<button class="btn btn-sm" style="margin-top:11px" data-rentedit>' + ico('edit') + 'Edit rent history</button></div>') +
    '</div>';

  var ov = openModal(modalShell({
    wide: true,
    title: isNew ? 'Create lease' : 'Edit lease',
    sub: isNew ? 'Rent tracking starts as soon as the lease is saved' : tenantName(l.tenantId) + ' · ' + unitFullName(l.unitId),
    body: body,
    foot: (isNew ? '' : '<button class="btn btn-danger" data-del>' + ico('trash') + 'Delete lease</button>') +
      '<span class="spacer"></span><button class="btn btn-ghost" data-x>Cancel</button>' +
      '<button class="btn btn-primary" data-save>' + (isNew ? 'Create lease' : 'Save changes') + '</button>'
  }));
  bindModalClose();
  var re = ov.querySelector('[data-rentedit]');
  if (re) re.addEventListener('click', function () { closeModal(); openRentHistoryModal(l.id); });

  ov.querySelector('[data-save]').addEventListener('click', function () {
    var unitSel = readVal(ov, 'lUnit'), tenantSel = readVal(ov, 'lTenant');
    markInvalid(ov, 'lUnit', !unitSel); markInvalid(ov, 'lTenant', !tenantSel);
    if (!unitSel) { toast('Choose which unit this lease is for.', 'err'); return; }
    if (!tenantSel) { toast('Choose the tenant for this lease.', 'err'); return; }
    var start = readVal(ov, 'lStart') || todayISO();
    var end = readVal(ov, 'lEnd');
    if (end && end < start) { markInvalid(ov, 'lEnd', true); toast('The lease end cannot be before the lease start.', 'err'); return; }
    var newRent = readNum(ov, 'lRent');

    /* Rent history: keep earlier months untouched. A lease that has not
       started yet simply has its opening amount corrected. */
    var sched = (l.rentSchedule || []).map(function (e) { return { from: e.from, amount: e.amount }; });
    if (isNew) {
      sched = [{ from: monthOf(start), amount: newRent }];
    } else if (Math.abs(newRent - currentRent) > EPS) {
      if (start > todayISO() || monthOf(start) >= thisMonth()) {
        sched = sched.map(function (e, i) { return i === 0 ? { from: monthOf(start), amount: newRent } : e; });
      } else {
        var cm = thisMonth();
        var existing = sched.filter(function (e) { return e.from === cm; })[0];
        if (existing) existing.amount = newRent;
        else sched.push({ from: cm, amount: newRent });
      }
    } else if (sched.length && monthOf(start) < sched[0].from) {
      sched[0] = { from: monthOf(start), amount: sched[0].amount };
    }

    var rec = normLease({
      id: l.id, unitId: unitSel, tenantId: tenantSel,
      propertyId: (getUnit(unitSel) || {}).propertyId || '',
      start: start, end: end, dueDay: readNum(ov, 'lDueDay') || 1,
      prorate: readChecked(ov, 'lProrate'),
      rentSchedule: sched,
      deposit: {
        amount: readNum(ov, 'lDep'), receivedDate: readVal(ov, 'lDepDate'),
        status: readVal(ov, 'lDepStatus'), returned: l.deposit.returned,
        returnedDate: l.deposit.returnedDate, deductions: l.deposit.deductions, notes: l.deposit.notes
      },
      moveIn: readVal(ov, 'lMoveIn'), moveOut: readVal(ov, 'lMoveOut'),
      notes: readVal(ov, 'lNotes'), archived: l.archived, createdAt: l.createdAt
    });
    closeModal();
    commit(function () {
      if (isNew) S.leases.push(rec);
      else S.leases = S.leases.map(function (x) { return x.id === rec.id ? rec : x; });
      /* Keep the unit's headline rent in step with a brand new lease. */
      var unit = S.units.filter(function (x) { return x.id === rec.unitId; })[0];
      if (unit && isNew) { unit.rent = newRent; unit.dueDay = rec.dueDay; if (unit.status === 'vacant') unit.status = 'occupied'; }
    }, isNew ? 'Lease created. Rent is now being tracked.' : 'Lease updated.');
  });

  if (!isNew) {
    ov.querySelector('[data-del]').addEventListener('click', function () {
      closeModal();
      var pays = paymentsOfLease(l.id).length;
      confirmDialog({
        title: 'Delete this lease?',
        danger: true, okLabel: 'Delete lease',
        bodyHtml: '<p>' + esc(tenantName(l.tenantId)) + ' · ' + esc(unitFullName(l.unitId)) + '</p>' +
          (pays ? '<p style="margin-top:8px">This will also delete <strong>' + pays + ' rent ' + plural(pays, 'payment') + '</strong> and any adjustments. Reports covering those months will change.</p>' : '<p style="margin-top:8px">No payments are recorded against this lease.</p>') +
          '<p style="margin-top:8px">If the tenancy simply ended, setting a move-out date keeps the history instead.</p>',
        onConfirm: function () {
          commit(function () {
            S.leases = S.leases.filter(function (x) { return x.id !== l.id; });
            S.payments = S.payments.filter(function (x) { return x.leaseId !== l.id; });
            S.adjustments = S.adjustments.filter(function (x) { return x.leaseId !== l.id; });
          }, 'Lease deleted.', 'delete lease');
        }
      });
    });
  }
}

/* --- rent history editor --------------------------------------------------- */
function openRentHistoryModal(leaseId) {
  var l = getLease(leaseId);
  if (!l) return;
  function rowsHtml() {
    return l.rentSchedule.map(function (e, i) {
      return '<div class="rowflex" style="flex-wrap:nowrap;gap:9px;padding:7px 0;border-bottom:1px solid var(--border)">' +
        '<input type="month" class="inp" data-rs-from="' + i + '" value="' + attr(e.from) + '" aria-label="Rent applies from" style="max-width:170px">' +
        '<div class="money-wrap" style="flex:1"><span class="cur">' + esc(curSymbol()) + '</span>' +
        '<input type="number" step="0.01" class="inp" data-rs-amt="' + i + '" value="' + attr(round2(e.amount)) + '" aria-label="Monthly rent"></div>' +
        (l.rentSchedule.length > 1 ? '<button class="icon-btn danger" data-rs-del="' + i + '" aria-label="Remove this rent change">' + ico('trash') + '</button>' : '<span style="width:27px"></span>') +
        '</div>';
    }).join('');
  }
  var ov = openModal(modalShell({
    title: 'Rent history',
    sub: tenantName(l.tenantId) + ' · ' + unitFullName(l.unitId),
    body: '<div class="stack">' +
      '<div class="flag info">' + ico('info') + '<span class="grow">Each row says what the rent was from that month onwards. Past months always keep the rent that applied at the time, so a rent increase never rewrites an old report.</span></div>' +
      '<div id="rsRows">' + rowsHtml() + '</div>' +
      '<button class="btn btn-sm" data-add style="align-self:flex-start">' + ico('plus') + 'Add a rent change</button>' +
      '</div>',
    foot: '<span class="spacer"></span><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-primary" data-save>Save rent history</button>'
  }));
  bindModalClose();

  function readRows() {
    var out = [];
    ov.querySelectorAll('[data-rs-from]').forEach(function (el) {
      var i = el.getAttribute('data-rs-from');
      var amt = ov.querySelector('[data-rs-amt="' + i + '"]');
      if (el.value) out.push({ from: el.value.slice(0, 7), amount: num(amt ? amt.value : 0) });
    });
    return out;
  }
  function redraw() {
    byId('rsRows') && (ov.querySelector('#rsRows').innerHTML = rowsHtml());
    bindRows();
  }
  function bindRows() {
    ov.querySelectorAll('[data-rs-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = +b.getAttribute('data-rs-del');
        l.rentSchedule = readRows().filter(function (_, k) { return k !== i; });
        if (!l.rentSchedule.length) l.rentSchedule = [{ from: thisMonth(), amount: 0 }];
        redraw();
      });
    });
  }
  bindRows();
  ov.querySelector('[data-add]').addEventListener('click', function () {
    l.rentSchedule = readRows();
    var last = l.rentSchedule[l.rentSchedule.length - 1];
    l.rentSchedule.push({ from: last ? addMonthsYM(last.from, 1) : thisMonth(), amount: last ? last.amount : 0 });
    redraw();
  });
  ov.querySelector('[data-save]').addEventListener('click', function () {
    var rows = readRows();
    if (!rows.length) { toast('Keep at least one rent amount.', 'err'); return; }
    closeModal();
    commit(function () {
      var t = S.leases.filter(function (x) { return x.id === leaseId; })[0];
      if (t) t.rentSchedule = normRentSchedule(rows, 0, t.start);
    }, 'Rent history updated. Earlier months are unchanged.', 'rent history');
  });
}

/* ==========================================================================
   30. MODALS — rent payments, adjustments & rent period detail
   ========================================================================== */

/** Leases available to receive a payment, grouped by property. */
function payLeaseOptions(selected) {
  var h = '<option value="">Choose a unit</option>';
  var byProp = groupBy(S.leases, function (l) { return l.propertyId; });
  byProp.keys.forEach(function (pid) {
    var live = byProp.map[pid].filter(function (l) { return leaseIsActive(l) || leaseIsFuture(l); });
    var past = byProp.map[pid].filter(function (l) { return leaseIsEnded(l); });
    var mk = function (l) {
      return '<option value="' + attr(l.id) + '"' + (selected === l.id ? ' selected' : '') + '>' +
        esc(unitName(l.unitId) + ' — ' + tenantName(l.tenantId)) + '</option>';
    };
    if (live.length) h += '<optgroup label="' + attr(propertyName(pid)) + '">' + live.map(mk).join('') + '</optgroup>';
    if (past.length) h += '<optgroup label="' + attr(propertyName(pid) + ' — ended leases') + '">' + past.map(mk).join('') + '</optgroup>';
  });
  return h;
}

/** Months a lease covers, from its start up to one month ahead of today. */
function leasePeriods(l) {
  if (!l) return [];
  var out = [], from = monthOf(l.start);
  var hardEnd = leaseEndDate(l) ? monthOf(leaseEndDate(l)) : '';
  var to = addMonthsYM(thisMonth(), 1);
  if (hardEnd && hardEnd < to) to = hardEnd;
  var guard = 0;
  for (var ym = from; ym <= to && guard++ < 400; ym = addMonthsYM(ym, 1)) out.push(ym);
  return out;
}

function openPaymentModal(opts) {
  opts = opts || {};
  if (!S.leases.length) {
    toast('Create a lease first — rent is tracked against a lease.', 'err');
    if (S.units.length) openLeaseModal();
    else if (!S.properties.length) openPropertyModal();
    return;
  }
  var leaseId = opts.leaseId || '';
  if (!leaseId) {
    /* Default to the unit with the oldest unpaid rent, else the first active lease. */
    var owed = sortBy(owingObligations(), function (o) { return o.dueDate; }, 'asc')[0];
    leaseId = owed ? owed.leaseId : (activeLeases()[0] || S.leases[0]).id;
  }

  var body = '<div class="stack">' +
    '<div class="form-grid two">' +
      fSelect('payLease', 'Property & unit', payLeaseOptions(leaseId), { span: true }) +
      '<div class="field"><label for="payPeriod">Rent month this pays for</label><select class="sel" id="payPeriod"></select>' +
        '<div class="help">Payments are matched to the month of rent they cover, not the day they arrived.</div></div>' +
      fDate('payDate', 'Payment date', opts.date || todayISO()) +
      fMoney('payAmount', 'Amount received', '') +
      fSelect('payMethod', 'Payment method', optionsFrom(PAYMENT_METHODS, 'Bank transfer', 'Not recorded')) +
      fText('payRef', 'Reference (optional)', '', { placeholder: 'Bank reference, cheque number…' }) +
      fArea('payNotes', 'Notes', '') +
    '</div>' +
    '<div id="paySummary"></div>' +
    '</div>';

  var ov = openModal(modalShell({
    title: 'Record rent payment',
    sub: 'Full or part payment — a month can take as many payments as it needs',
    body: body,
    foot: '<button class="btn btn-ghost" data-adjust>' + ico('edit') + 'Adjust amount due</button>' +
      '<span class="spacer"></span><button class="btn btn-ghost" data-x>Cancel</button>' +
      '<button class="btn" data-savemore>Save &amp; add another</button>' +
      '<button class="btn btn-primary" data-save>Record payment</button>'
  }));
  bindModalClose();

  var leaseSel = ov.querySelector('#payLease');
  var periodSel = ov.querySelector('#payPeriod');
  var amountEl = ov.querySelector('#payAmount');
  var touchedAmount = false;
  amountEl.addEventListener('input', function () { touchedAmount = true; });

  function currentLease() { return getLease(leaseSel.value); }

  function fillPeriods(preferred) {
    var l = currentLease();
    periodSel.innerHTML = '';
    if (!l) return;
    var periods = leasePeriods(l);
    var pick = preferred;
    if (!pick) {
      /* Default to the oldest month that still owes something. */
      for (var i = 0; i < periods.length; i++) {
        var ob = obligationFor(l, periods[i]);
        if (ob.balance > EPS) { pick = periods[i]; break; }
      }
      if (!pick) pick = periods.length ? periods[periods.length - 1] : thisMonth();
    }
    periods.slice().reverse().forEach(function (ym) {
      var ob = obligationFor(l, ym);
      var note = ob.balance > EPS ? money(ob.balance) + ' outstanding' : (ob.due > EPS ? 'paid in full' : 'nothing due');
      periodSel.innerHTML += '<option value="' + ym + '"' + (ym === pick ? ' selected' : '') + '>' +
        esc(fmtMonthLong(ym) + ' — ' + note) + '</option>';
    });
    if (!periods.length) periodSel.innerHTML = '<option value="' + thisMonth() + '">' + esc(fmtMonthLong(thisMonth())) + '</option>';
  }

  function refresh(resetAmount) {
    var l = currentLease();
    var host = ov.querySelector('#paySummary');
    if (!l) { host.innerHTML = ''; return; }
    var ym = periodSel.value || thisMonth();
    var ob = obligationFor(l, ym);
    if (resetAmount && !touchedAmount) amountEl.value = ob.balance > EPS ? round2(ob.balance) : '';
    var entered = num(amountEl.value);
    var after = round2(ob.balance - entered);
    host.innerHTML = '<div class="fieldset"><div class="lg">' + ico('cash') + esc(fmtMonthLong(ym)) + ' · ' + esc(unitFullName(l.unitId)) + '</div>' +
      mrow('Rent due', ob.due) +
      (Math.abs(ob.adjustment) > EPS ? mrow('includes adjustments', ob.adjustment, { sub: true }) : '') +
      mrow('Already paid', ob.paid) +
      (ob.payments.length ? ob.payments.map(function (p) {
        return mrow(fmtDate(p.date) + (p.method ? ' · ' + p.method : ''), p.amount, { sub: true });
      }).join('') : '') +
      mrow('Remaining before this payment', ob.balance, { tone: ob.balance > EPS ? 'neg' : 'pos' }) +
      (entered > 0 ? mrow('Remaining after this payment', after, { total: true, tone: after > EPS ? 'neg' : 'pos' }) : '') +
      (entered > 0 && after < -EPS ? '<div class="note" style="margin-top:8px">This is more than the outstanding balance. The extra is recorded as an overpayment on this month.</div>' : '') +
      '</div>';
  }

  leaseSel.addEventListener('change', function () { touchedAmount = false; fillPeriods(); refresh(true); });
  periodSel.addEventListener('change', function () { touchedAmount = false; refresh(true); });
  amountEl.addEventListener('input', debounce(function () { refresh(false); }, 160));

  fillPeriods(opts.period);
  refresh(true);
  setTimeout(function () { try { amountEl.focus(); amountEl.select(); } catch (e) {} }, 60);

  ov.querySelector('[data-adjust]').addEventListener('click', function () {
    var l = currentLease();
    if (!l) return;
    var ym = periodSel.value;
    closeModal();
    openAdjustmentModal(l.id, ym);
  });

  function build() {
    var l = currentLease();
    if (!l) { markInvalid(ov, 'payLease', true); toast('Choose which unit this payment is for.', 'err'); return null; }
    var amt = num(amountEl.value);
    if (amt <= 0) { markInvalid(ov, 'payAmount', true); toast('Enter the amount received.', 'err'); amountEl.focus(); return null; }
    markInvalid(ov, 'payAmount', false);
    return normPayment({
      leaseId: l.id, unitId: l.unitId, propertyId: l.propertyId, tenantId: l.tenantId,
      period: periodSel.value || thisMonth(),
      date: readVal(ov, 'payDate') || todayISO(),
      amount: amt, method: readVal(ov, 'payMethod'),
      reference: readVal(ov, 'payRef'), notes: readVal(ov, 'payNotes')
    });
  }
  function persist(rec, keepOpen) {
    if (!demoAllow(1)) return;
    commit(function () { S.payments.push(rec); },
      money(rec.amount) + ' recorded for ' + fmtMonthLong(rec.period) + '.');
    demoCounted(1);
    if (keepOpen && demoLeft() > 0) openPaymentModal({ leaseId: rec.leaseId });
  }
  ov.querySelector('[data-save]').addEventListener('click', function () {
    var rec = build(); if (!rec) return;
    closeModal(); persist(rec, false);
  });
  ov.querySelector('[data-savemore]').addEventListener('click', function () {
    var rec = build(); if (!rec) return;
    closeModal(); persist(rec, true);
  });
}

/* --- adjustment ------------------------------------------------------------ */
function openAdjustmentModal(leaseId, period) {
  var l = getLease(leaseId);
  if (!l) return;
  var ob = obligationFor(l, period);

  var body = '<div class="stack">' +
    '<div class="fieldset plain"><div class="lg">' + esc(fmtMonthLong(period)) + ' · ' + esc(unitFullName(l.unitId)) + '</div>' +
      mrow('Rent before adjustments', ob.base) +
      mrow('Adjustments so far', ob.adjustment) +
      mrow('Currently due', ob.due, { total: true }) + '</div>' +
    '<div class="form-grid two">' +
      fSelect('adjKind', 'Type of adjustment', ADJUSTMENT_KINDS.map(function (k) {
        return '<option value="' + k.id + '">' + esc(k.label) + '</option>';
      }).join(''), { span: true }) +
      fMoney('adjAmount', 'Amount', '', { help: 'Enter a positive number. The type above decides whether it lowers or raises the rent due.' }) +
      fDate('adjDate', 'Date', todayISO()) +
      fArea('adjNote', 'Reason', '', { placeholder: 'Why this adjustment was made…' }) +
    '</div>' +
    '<div id="adjPreview"></div>' +
    (ob.adjustments.length ? '<div class="fieldset"><div class="lg">Existing adjustments</div>' +
      ob.adjustments.map(function (a) {
        var k = ADJUSTMENT_KINDS.filter(function (x) { return x.id === a.kind; })[0];
        return '<div class="rowflex" style="padding:6px 0;border-bottom:1px solid var(--border);flex-wrap:nowrap">' +
          '<span style="flex:1;min-width:0"><strong style="font-size:13px">' + esc(k ? k.label : a.kind) + '</strong>' +
          '<div class="note">' + esc(fmtDate(a.date) + (a.note ? ' · ' + a.note : '')) + '</div></span>' +
          '<span class="num" style="font-weight:600">' + money(a.amount) + '</span>' +
          '<button class="icon-btn danger" data-deladj="' + attr(a.id) + '" aria-label="Remove adjustment">' + ico('trash') + '</button></div>';
      }).join('') + '</div>' : '') +
    '<div class="disclaimer">Only use fees permitted by your lease and local rules. This app never calculates or suggests a late fee for you.</div>' +
    '</div>';

  var ov = openModal(modalShell({
    title: 'Adjust rent due',
    sub: 'Concessions, credits, prorated amounts, write-offs or a fee set out in the lease',
    body: body,
    foot: '<span class="spacer"></span><button class="btn btn-ghost" data-x>Cancel</button><button class="btn btn-primary" data-save>Apply adjustment</button>'
  }));
  bindModalClose();

  function preview() {
    var kind = readVal(ov, 'adjKind');
    var k = ADJUSTMENT_KINDS.filter(function (x) { return x.id === kind; })[0] || ADJUSTMENT_KINDS[0];
    var signed = round2(Math.abs(readNum(ov, 'adjAmount')) * k.sign);
    ov.querySelector('#adjPreview').innerHTML = '<div class="flag ' + (signed < 0 ? 'info' : '') + '">' + ico('info') +
      '<span class="grow">' + esc(k.hint) + (Math.abs(signed) > EPS
        ? ' Rent due for ' + fmtMonthLong(period) + ' becomes <strong>' + money(round2(ob.due + signed)) + '</strong>.'
        : '') + '</span></div>';
  }
  ov.querySelector('#adjKind').addEventListener('change', preview);
  ov.querySelector('#adjAmount').addEventListener('input', debounce(preview, 140));
  preview();

  ov.querySelectorAll('[data-deladj]').forEach(function (b) {
    b.addEventListener('click', function () {
      var aid = b.getAttribute('data-deladj');
      closeModal();
      commit(function () { S.adjustments = S.adjustments.filter(function (x) { return x.id !== aid; }); }, 'Adjustment removed.', 'adjustment');
    });
  });

  ov.querySelector('[data-save]').addEventListener('click', function () {
    var raw = Math.abs(readNum(ov, 'adjAmount'));
    if (raw <= 0) { markInvalid(ov, 'adjAmount', true); toast('Enter an amount for the adjustment.', 'err'); return; }
    var kind = readVal(ov, 'adjKind');
    var k = ADJUSTMENT_KINDS.filter(function (x) { return x.id === kind; })[0] || ADJUSTMENT_KINDS[0];
    var rec = normAdjustment({
      leaseId: l.id, unitId: l.unitId, propertyId: l.propertyId, period: period,
      kind: kind, amount: round2(raw * k.sign),
      date: readVal(ov, 'adjDate') || todayISO(), note: readVal(ov, 'adjNote')
    });
    closeModal();
    commit(function () { S.adjustments.push(rec); }, 'Adjustment applied to ' + fmtMonthLong(period) + '.', 'adjustment');
  });
}

/* --- tenant detail --------------------------------------------------------- */
function openTenantDetail(id) {
  var t = getTenant(id);
  if (!t) { toast('That tenant is no longer in your records.', 'err'); return; }
  var leases = sortBy(leasesOfTenant(id), function (l) { return l.start; }, 'desc');
  var allObs = [];
  leases.forEach(function (l) {
    leasePeriods(l).forEach(function (ym) {
      if (leaseCoversMonth(l, ym)) allObs.push(obligationFor(l, ym));
    });
  });
  var roll = rollupRent(allObs);
  var owed = allObs.filter(function (o) { return o.balance > EPS && o.status !== 'upcoming'; });

  var body = '<div class="stack">' +
    '<div class="summary-strip">' +
      stripCell('Rent scheduled', money(roll.scheduled)) +
      stripCell('Rent paid', '<span class="pos">' + money(roll.collected) + '</span>') +
      stripCell('Outstanding', (roll.outstanding > EPS ? '<span class="neg">' : '<span>') + money(roll.outstanding) + '</span>') +
      stripCell('Collection', pct(roll.collectionRate)) +
      stripCell('Leases', nfmt(leases.length)) +
    '</div>' +
    (t.email || t.phone ? '<div class="fieldset plain"><div class="lg">' + ico('users') + 'Contact</div>' +
      (t.email ? '<div class="moneyrow"><span class="k">Email</span><span class="v" style="font-weight:500">' + esc(t.email) + '</span></div>' : '') +
      (t.phone ? '<div class="moneyrow"><span class="k">Phone</span><span class="v" style="font-weight:500">' + esc(t.phone) + '</span></div>' : '') +
      '</div>' : '') +
    '<div class="fieldset"><div class="lg">' + ico('key') + 'Leases</div>' +
      (leases.length ? leases.map(function (l) {
        var ls = leaseState(l);
        return '<div class="rowflex" style="padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:nowrap;align-items:flex-start">' +
          '<span style="flex:1;min-width:0"><strong style="font-size:13.5px">' + esc(unitFullName(l.unitId)) + '</strong>' +
          '<div class="note">' + esc(fmtDate(l.start) + ' – ' + (l.end ? fmtDate(l.end) : 'rolling')) + ' · ' + money(rentForMonth(l, thisMonth())) + ' per month</div>' +
          (num(l.deposit.amount) > 0 ? '<div class="note">Deposit ' + money(l.deposit.amount) + ' · ' + esc(depositStatusMeta(l.deposit.status).label) + '</div>' : '') + '</span>' +
          '<span class="badge ' + ls.cls + '">' + esc(ls.label) + '</span>' +
          '<button class="icon-btn" data-editlease="' + attr(l.id) + '" aria-label="Edit lease">' + ico('edit') + '</button></div>';
      }).join('') : '<div class="note">No leases recorded for this tenant.</div>') +
    '</div>' +
    (owed.length ? '<div class="fieldset"><div class="lg">' + ico('alert') + 'Outstanding rent</div>' +
      owed.map(function (o) {
        return mrow(fmtMonthLong(o.period) + (o.daysOverdue > 0 ? ' · ' + o.daysOverdue + ' ' + plural(o.daysOverdue, 'day') + ' overdue' : ''), o.balance, { tone: 'neg' });
      }).join('') +
      mrow('Total outstanding', sum(owed, function (o) { return o.balance; }), { total: true, tone: 'neg' }) + '</div>' : '') +
    (t.notes ? '<div class="fieldset"><div class="lg">' + ico('note') + 'Notes</div><div style="font-size:13.5px;line-height:1.6;color:var(--text-2);white-space:pre-wrap">' + esc(t.notes) + '</div></div>' : '') +
    '</div>';

  var ov = openModal(modalShell({
    wide: true,
    title: t.name + (t.archived ? ' (former tenant)' : ''),
    sub: leases.length && leases[0] ? unitFullName(leases[0].unitId) : 'No lease',
    body: body,
    foot: '<button class="btn" data-edit>' + ico('edit') + 'Edit tenant</button>' +
      '<span class="spacer"></span><button class="btn btn-ghost" data-x>Close</button>' +
      '<button class="btn btn-primary" data-pay>' + ico('plus') + 'Record payment</button>'
  }));
  bindModalClose();
  ov.querySelector('[data-edit]').addEventListener('click', function () { closeModal(); openTenantModal(id); });
  ov.querySelector('[data-pay]').addEventListener('click', function () {
    var live = leases.filter(leaseIsActive)[0] || leases[0];
    closeModal(); openPaymentModal({ leaseId: live ? live.id : '' });
  });
  ov.querySelectorAll('[data-editlease]').forEach(function (b) {
    b.addEventListener('click', function () { var lid = b.getAttribute('data-editlease'); closeModal(); openLeaseModal(lid); });
  });
}

    foot: (isNew ? '' : '<button class="btn btn-danger" data-del>' + ico('trash') + 'Delete</button>') +
      '<span class="spacer"></span><button class="btn btn-ghost" data-x>Cancel</button>' +
      (isNew ? '<button class="btn" data-savemore>Save &amp; add another</button>' : '') +
      '<button class="btn btn-primary" data-save>' + (isNew ? 'Add expense' : 'Save changes') + '</button>'
  }));
  bindModalClose();

  function setScope(next) {
    scope = next;
    var wrap = ov.querySelector('#expPropWrap');
    if (wrap) wrap.hidden = (scope === 'business');
    var catSel = ov.querySelector('#eCategory');
    var keep = catSel.value;
    var list = scope === 'business' ? S.businessCategories : S.expenseCategories;
    catSel.innerHTML = optionsFrom(list, list.indexOf(keep) >= 0 ? keep : list[0], 'Choose a category');
    ov.querySelector('#expScopeNote').innerHTML = scope === 'business'
      ? '<div class="flag info">' + ico('box') + '<span class="grow">Business costs are not tied to a property. They stay out of each property\'s profit &amp; loss and appear in your portfolio result.</span></div>'
      : '';
    ov.querySelectorAll('#expScope button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-scope') === scope);
    });
  }
  ov.querySelectorAll('#expScope button').forEach(function (b) {
    b.addEventListener('click', function () { setScope(b.getAttribute('data-scope')); });
  });
  setScope(scope);

  var propSel = ov.querySelector('#eProperty');
  if (propSel) propSel.addEventListener('change', function () {
    ov.querySelector('#eUnit').innerHTML = unitOptions(propSel.value, '', 'Whole property');
  });
  setTimeout(function () { var a = ov.querySelector('#eAmount'); if (a) a.focus(); }, 50);

  function build() {
    var amt = readNum(ov, 'eAmount');
    if (amt <= 0) { markInvalid(ov, 'eAmount', true); toast('Enter the amount of this expense.', 'err'); return null; }
    markInvalid(ov, 'eAmount', false);
    var pid = scope === 'business' ? '' : readVal(ov, 'eProperty');
    if (scope === 'property' && !pid) { markInvalid(ov, 'eProperty', true); toast('Choose which property this expense belongs to.', 'err'); return null; }
    var vid = readVal(ov, 'eVendor');
    return normExpense({
      id: e.id, scope: scope, propertyId: pid,
      unitId: scope === 'business' ? '' : readVal(ov, 'eUnit'),
      date: readVal(ov, 'eDate') || todayISO(),
      vendorId: vid, vendorName: vid ? vendorName(vid) : e.vendorName,
      category: readVal(ov, 'eCategory'), description: readVal(ov, 'eDescription'),
      amount: amt, method: readVal(ov, 'eMethod'),
      taxFlag: readChecked(ov, 'eTaxFlag'), taxCategory: readVal(ov, 'eTaxCategory'),
      maintenanceId: e.maintenanceId, recurringId: e.recurringId,
      notes: readVal(ov, 'eNotes'), createdAt: e.createdAt
    });
  }
  function persist(rec) {
    if (isNew && !demoAllow(1)) return false;
    commit(function () {
      if (isNew) S.expenses.push(rec);
      else S.expenses = S.expenses.map(function (x) { return x.id === rec.id ? rec : x; });
      if (rec.maintenanceId) {
        var m = S.maintenance.filter(function (x) { return x.id === rec.maintenanceId; })[0];
        if (m) m.expenseId = rec.id;
      }
    }, isNew ? 'Expense added.' : 'Expense updated.');
    if (isNew) demoCounted(1);
    return true;
  }
  ov.querySelector('[data-save]').addEventListener('click', function () {
    var rec = build(); if (!rec) return; closeModal(); persist(rec);
  });
  if (isNew) {
    ov.querySelector('[data-savemore]').addEventListener('click', function () {
      var rec = build(); if (!rec) return;
      closeModal(); if (!persist(rec) || !demoLeft()) return;
      openExpenseModal(null, { scope: rec.scope, propertyId: rec.propertyId, category: rec.category });
    });
  } else {
    ov.querySelector('[data-del]').addEventListener('click', function () {
      closeModal();
      confirmDialog({
        title: 'Delete this expense?', danger: true, okLabel: 'Delete expense',
        body: (e.description || 'This expense') + ' · ' + money(e.amount) + '. Reports for this period will change.',
        onConfirm: function () {
          commit(function () {
            S.expenses = S.expenses.filter(function (x) { return x.id !== e.id; });
            S.maintenance.forEach(function (m) { if (m.expenseId === e.id) m.expenseId = ''; });
          }, 'Expense deleted.', 'expense');
        }
      });
    });
  }
}

/** Turn a due recurring template into a real expense the user can review first. */
function recordRecurring(id) {
  var t = S.recurring.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  var due = nextRecurringDate(t) || todayISO();
  openExpenseModal(null, {
    scope: t.scope, propertyId: t.propertyId, unitId: t.unitId,
    date: due, category: t.category, description: t.description,
    amount: t.amount, vendorName: t.vendorName, recurringId: t.id, lockScope: true
  });
  /* Advance the template only once the expense really exists — if validation
     failed and the form stayed open, nothing is marked as recorded. */
  var ov = modalStack[modalStack.length - 1];
  if (!ov) return;
  ['[data-save]', '[data-savemore]'].forEach(function (sel) {
    var b = ov.querySelector(sel);
    if (b) b.addEventListener('click', function () {
      setTimeout(function () {
        var created = S.expenses.some(function (x) { return x.recurringId === id && x.date === due; });
        if (!created) return;
        var tt = S.recurring.filter(function (x) { return x.id === id; })[0];
        if (tt) { tt.lastRecorded = due; save(); }
      }, 40);
    });
  });
}

/** Push a maintenance cost into property expenses, linked so it counts once. */
function maintToExpense(id, prompted) {
  var m = S.maintenance.filter(function (x) { return x.id === id; })[0];
  if (!m) return;
  if (m.expenseId) { toast('This cost is already recorded in your expenses.', 'ok'); return; }
  if (num(m.actualCost) <= EPS) { toast('Add an actual cost to this job first.', 'err'); return; }

  var run = function () {
    openExpenseModal(null, {
      scope: 'property', propertyId: m.propertyId, unitId: m.unitId,
      date: m.completedDate || todayISO(),
      category: MAINTENANCE_EXPENSE_CATEGORIES.indexOf('Repairs') >= 0 ? 'Repairs' : S.expenseCategories[0],
      description: m.title, amount: m.actualCost,
      vendorId: m.vendorId, vendorName: vendorName(m.vendorId),
      maintenanceId: m.id, lockScope: true
    });
  };
  if (!prompted) { run(); return; }
  confirmDialog({
    title: 'Add this cost to property expenses?',
    okLabel: 'Add to expenses',
    bodyHtml: '<p><strong>' + esc(m.title) + '</strong> · ' + money(m.actualCost) + '</p>' +
      '<p style="margin-top:8px">Maintenance costs only appear in your profit &amp; loss once they are recorded as an expense. The two records stay linked, so the cost is counted exactly once.</p>',
    onConfirm: run
  });
}

function parseCSV(text) {
  var rows = [], row = [], field = '', inQ = false;
  text = String(text || '').replace(/^﻿/, '');
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c === '\r') { /* handled by \n */ }
    else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
}

function guessMapping(headers, fields) {
  var map = {}, used = {};
  fields.forEach(function (f) {
    for (var i = 0; i < headers.length; i++) {
      if (used[i]) continue;
      var h = String(headers[i] || '').toLowerCase().trim();
      if (!h) continue;
      for (var j = 0; j < f.match.length; j++) {
        if (h === f.match[j] || h.indexOf(f.match[j]) >= 0) { map[f.key] = i; used[i] = 1; return; }
      }
    }
  });
  return map;
}
function parseImportDate(v, fmt) {
  var s = String(v || '').trim();
  if (!s) return '';
  if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) {
    var p = s.split(/[-T ]/);
    return p[0] + '-' + (p[1].length < 2 ? '0' : '') + p[1] + '-' + (p[2].length < 2 ? '0' : '') + p[2].slice(0, 2);
  }
  var m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s);
  if (m) {
    var a = +m[1], b = +m[2], y = +m[3];
    if (y < 100) y += 2000;
    var d = fmt === 'dmy' ? a : b, mo = fmt === 'dmy' ? b : a;
    if (mo > 12 && d <= 12) { var t = d; d = mo; mo = t; }
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
    return y + '-' + (mo < 10 ? '0' : '') + mo + '-' + (d < 10 ? '0' : '') + d;
  }
  var dt = new Date(s);
  return isNaN(dt.getTime()) ? '' : toISO(dt);
}
function parseImportMonth(v, fallbackDate) {
  var s = String(v || '').trim();
  if (/^\d{4}-\d{1,2}$/.test(s)) { var p = s.split('-'); return p[0] + '-' + (p[1].length < 2 ? '0' : '') + p[1]; }
  var iso = parseImportDate(s, S.settings.dateFormat === 'mdy' ? 'mdy' : 'dmy');
  if (iso) return monthOf(iso);
  for (var i = 0; i < MONTH_NAMES.length; i++) {
    if (s.toLowerCase().indexOf(MONTH_NAMES[i].toLowerCase()) === 0 || s.toLowerCase().indexOf(MONTH_SHORT[i].toLowerCase()) === 0) {
      var yr = (/(\d{4})/.exec(s) || [])[1] || todayISO().slice(0, 4);
      return yr + '-' + (i + 1 < 10 ? '0' : '') + (i + 1);
    }
  }
  return monthOf(fallbackDate || todayISO());
}

      parsed = parseCSV(text);
      if (parsed.length < 2) { toast('That file has no data rows.', 'err'); return; }
      headers = parsed[0];
      dataRows = parsed.slice(1);
      renderMapper(name);
    });
  });

  function renderMapper(fileName) {
    var type = currentType();
    var map = guessMapping(headers, type.fields);
    var h = '<div class="fieldset"><div class="lg">' + ico('link') + 'Match your columns' + (fileName ? ' · ' + esc(fileName) : '') + '</div>';
    type.fields.forEach(function (f) {
      h += '<div class="mapper"><div class="src"><label for="map_' + f.key + '">' + esc(f.label) + (f.required ? ' *' : '') + '</label></div>' +
        '<div class="ar">' + ico('right') + '</div>' +
        '<div><select class="sel" id="map_' + f.key + '" data-mapfield="' + f.key + '"><option value="">Not in my file</option>' +
        headers.map(function (hh, i) {
          return '<option value="' + i + '"' + (map[f.key] === i ? ' selected' : '') + '>' + esc(hh || 'Column ' + (i + 1)) + '</option>';
        }).join('') + '</select></div></div>';
    });
    h += '</div><div id="impPreview"></div>';
    ov.querySelector('#impArea').innerHTML = h;
    ov.querySelectorAll('[data-mapfield]').forEach(function (s) { s.addEventListener('change', preview); });
    preview();
  }

  function readMap() {
    var map = {};
    ov.querySelectorAll('[data-mapfield]').forEach(function (s) {
      if (s.value !== '') map[s.getAttribute('data-mapfield')] = +s.value;
    });
    return map;
  }
  function cellOf(row, map, key) {
    return map[key] === undefined ? '' : String(row[map[key]] === undefined ? '' : row[map[key]]).trim();
  }

  function buildRecords() {
    var kind = currentKind(), type = currentType(), map = readMap();
    var fmtEl = ov.querySelector('#impDate'), fmt = (fmtEl && fmtEl.value) || 'dmy';
    var ok = [], skipped = [], newProps = {};
    dataRows.forEach(function (row, n) {
      var get = function (k) { return cellOf(row, map, k); };
      var missing = type.fields.filter(function (f) { return f.required && !get(f.key); });
      if (missing.length) { skipped.push({ line: n + 2, why: 'missing ' + missing.map(function (f) { return f.label.toLowerCase(); }).join(', ') }); return; }

      if (kind === 'properties') {
        var nm = get('name');
        if (S.properties.some(function (p) { return p.name.toLowerCase() === nm.toLowerCase(); })) { skipped.push({ line: n + 2, why: 'a property called "' + nm + '" already exists' }); return; }
        ok.push({ kind: 'property', name: nm, address: get('address'), type: get('type'), rent: num(get('rent')), notes: get('notes') });
      } else if (kind === 'tenants') {
        var tn = get('name');
        if (S.tenants.some(function (t) { return t.name.toLowerCase() === tn.toLowerCase(); })) { skipped.push({ line: n + 2, why: 'a tenant called "' + tn + '" already exists' }); return; }
        ok.push({ kind: 'tenant', name: tn, email: get('email'), phone: get('phone'), notes: get('notes') });
      } else if (kind === 'expenses') {
        var d = parseImportDate(get('date'), fmt);
        if (!d) { skipped.push({ line: n + 2, why: 'the date could not be read' }); return; }
        var amt = num(get('amount'));
        if (amt <= 0) { skipped.push({ line: n + 2, why: 'the amount is missing or zero' }); return; }
        var pn = get('property');
        var prop = pn ? S.properties.filter(function (p) { return p.name.toLowerCase() === pn.toLowerCase(); })[0] : null;
        if (pn && !prop) newProps[pn] = 1;
        ok.push({ kind: 'expense', date: d, propertyName: pn, propertyId: prop ? prop.id : '', category: get('category') || 'Other', description: get('description'), vendorName: get('vendor'), amount: amt, notes: get('notes') });
      } else {
        var pd = parseImportDate(get('date'), fmt);
        if (!pd) { skipped.push({ line: n + 2, why: 'the payment date could not be read' }); return; }
        var pamt = num(get('amount'));
        if (pamt <= 0) { skipped.push({ line: n + 2, why: 'the amount is missing or zero' }); return; }
        var lease = matchLease(get('property'), get('unit'), get('tenant'), pd);
        if (!lease) { skipped.push({ line: n + 2, why: 'no matching lease was found' }); return; }
        ok.push({ kind: 'payment', leaseId: lease.id, date: pd, period: parseImportMonth(get('period'), pd), amount: pamt, method: get('method'), notes: get('notes'), label: tenantName(lease.tenantId) + ' · ' + unitFullName(lease.unitId) });
      }
    });
    return { ok: ok, skipped: skipped, newProps: Object.keys(newProps) };
  }

  function matchLease(propName, unitNm, tenantNm, date) {
    var cands = S.leases.slice();
    if (propName) {
      var byProp = cands.filter(function (l) { return propertyName(l.propertyId).toLowerCase() === propName.toLowerCase(); });
      if (byProp.length) cands = byProp;
    }
    if (unitNm) {
      var byUnit = cands.filter(function (l) { return unitName(l.unitId).toLowerCase() === unitNm.toLowerCase(); });
      if (byUnit.length) cands = byUnit;
    }
    if (tenantNm) {
      var byTen = cands.filter(function (l) { return tenantName(l.tenantId).toLowerCase() === tenantNm.toLowerCase(); });
      if (byTen.length) cands = byTen;
    }
    if (!cands.length) return null;
    var covering = cands.filter(function (l) { return leaseActiveOn(l, date); });
    if (covering.length) return covering[0];
    return (propName || unitNm || tenantNm) ? cands[0] : null;
  }

  function preview() {
    var res = buildRecords();
    goBtn.disabled = !res.ok.length;
    var h = '<div class="fieldset plain"><div class="lg">' + ico('eye') + 'Preview</div>' +
      '<div class="summary-strip" style="margin-bottom:12px">' +
        stripCell('Rows to import', nfmt(res.ok.length)) +
        stripCell('Rows skipped', nfmt(res.skipped.length)) +
        (res.newProps.length ? stripCell('New properties', nfmt(res.newProps.length)) : '') +
      '</div>';
    if (res.ok.length) {
      h += '<div class="table-wrap"><table class="tbl"><thead><tr>' +
        (currentKind() === 'payments' ? '<th>Date</th><th>Matched lease</th><th>Rent month</th><th class="r">Amount</th>'
          : currentKind() === 'expenses' ? '<th>Date</th><th>Property</th><th>Category</th><th>Description</th><th class="r">Amount</th>'
          : '<th>Name</th><th>Detail</th>') +
        '</tr></thead><tbody>';
      res.ok.slice(0, 6).forEach(function (x) {
        if (x.kind === 'payment') h += '<tr><td class="n">' + esc(fmtDate(x.date)) + '</td><td>' + esc(x.label) + '</td><td class="n">' + esc(fmtMonth(x.period)) + '</td><td class="r n">' + money(x.amount) + '</td></tr>';
        else if (x.kind === 'expense') h += '<tr><td class="n">' + esc(fmtDate(x.date)) + '</td><td>' + esc(x.propertyName || '—') + (x.propertyId ? '' : ' <span class="tag">new</span>') + '</td><td>' + esc(x.category) + '</td><td>' + esc(truncate(x.description, 30)) + '</td><td class="r n">' + money(x.amount) + '</td></tr>';
        else h += '<tr><td>' + esc(x.name) + '</td><td>' + esc(truncate([x.address, x.type, x.email, x.phone].filter(Boolean).join(' · ') || '—', 46)) + '</td></tr>';
      });
      h += '</tbody></table></div>';
      if (res.ok.length > 6) h += '<div class="note" style="margin-top:7px">…and ' + (res.ok.length - 6) + ' more ' + plural(res.ok.length - 6, 'row') + '.</div>';
    } else {
      h += '<div class="note">No rows can be imported with the current column matching. Check the required fields above.</div>';
    }
    if (res.skipped.length) {
      h += '<div class="flag" style="margin-top:12px">' + ico('alert') + '<span class="grow"><strong>' + res.skipped.length + ' ' + plural(res.skipped.length, 'row') + ' will be skipped.</strong> ' +
        esc(res.skipped.slice(0, 3).map(function (s) { return 'Line ' + s.line + ': ' + s.why; }).join('; ')) +
        (res.skipped.length > 3 ? ' …' : '') + '</span></div>';
    }
    h += '</div>';
    ov.querySelector('#impPreview').innerHTML = h;
  }

  goBtn.addEventListener('click', function () {
    var res = buildRecords();
    if (!res.ok.length) return;
    var demoAsk = res.ok.filter(function (x) { return x.kind === 'expense' || x.kind === 'payment'; }).length;
    if (demoAsk && !demoAllow(demoAsk)) return;
    var demoBefore = S.payments.length + S.expenses.length;
    closeModal();
    commit(function () {
      var propByName = {};
      S.properties.forEach(function (p) { propByName[p.name.toLowerCase()] = p; });
      res.ok.forEach(function (x) {
        if (x.kind === 'property') {
          var p = normProperty({ name: x.name, address: x.address, type: x.type, notes: x.notes });
          S.properties.push(p);
          propByName[p.name.toLowerCase()] = p;
          S.units.push(normUnit({ propertyId: p.id, name: 'Main unit', rent: x.rent, dueDay: S.settings.defaultDueDay, status: 'vacant' }));
        } else if (x.kind === 'tenant') {
          S.tenants.push(normTenant({ name: x.name, email: x.email, phone: x.phone, notes: x.notes }));
        } else if (x.kind === 'expense') {
          var pid = x.propertyId;
          if (!pid && x.propertyName) {
            var existing = propByName[x.propertyName.toLowerCase()];
            if (!existing) {
              existing = normProperty({ name: x.propertyName });
              S.properties.push(existing);
              propByName[x.propertyName.toLowerCase()] = existing;
            }
            pid = existing.id;
          }
          S.expenses.push(normExpense({
            date: x.date, scope: pid ? 'property' : 'business', propertyId: pid,
            category: x.category, description: x.description, vendorName: x.vendorName,
            amount: x.amount, notes: x.notes
          }));
        } else if (x.kind === 'payment') {
          var l = S.leases.filter(function (y) { return y.id === x.leaseId; })[0];
          if (!l) return;
          S.payments.push(normPayment({
            leaseId: l.id, unitId: l.unitId, propertyId: l.propertyId, tenantId: l.tenantId,
            period: x.period, date: x.date, amount: x.amount, method: x.method, notes: x.notes
          }));
        }
      });
    }, 'Imported ' + res.ok.length + ' ' + plural(res.ok.length, 'row') + '.', 'CSV import');
    demoCounted(S.payments.length + S.expenses.length - demoBefore);
  });
}

function pickFile(accept, cb) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = accept || '*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', function () {
    var file = input.files && input.files[0];
    if (!file) { document.body.removeChild(input); return; }
    var reader = new FileReader();
    reader.onload = function () {
      try { cb(String(reader.result), file.name); }
      catch (e) { toast('That file could not be read.', 'err'); }
      if (input.parentNode) document.body.removeChild(input);
    };
    reader.onerror = function () { toast('That file could not be read.', 'err'); if (input.parentNode) document.body.removeChild(input); };
    reader.readAsText(file);
  });
  input.click();
}

function isKnownAppId(id) { return LEGACY_APP_IDS.indexOf(String(id)) >= 0; }

function doBackup() {
  var payload = {
    app: APP_ID, appId: APP_ID, appName: APP_NAME,
    appVersion: APP_VERSION, dataSchemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    data: S
  };
  var name = 'FinNest-Backup-Rental-Property-Hub-' + todayISO() + '.json';
  if (downloadBlob(name, JSON.stringify(payload, null, 2), 'application/json')) {
    S.settings.lastBackupAt = new Date().toISOString();
    save(true);
    render();
    toast('Backup downloaded. Keep it somewhere safe.', 'ok');
  }
}

function doRestore() {
  pickFile('.json,application/json', function (text) {
    var parsed;
    try { parsed = JSON.parse(text); }
    catch (e) { toast('That file is not valid JSON.', 'err'); return; }

    /* Accept both the wrapped envelope and a plain state object from
       older builds, so no customer backup is ever rejected. */
    var envelopeId = parsed && (parsed.app || parsed.appId);
    var data = (parsed && parsed.data && typeof parsed.data === 'object') ? parsed.data : parsed;
    if (!data || typeof data !== 'object') { toast('That file does not contain any data.', 'err'); return; }

    var candidate;
    try { candidate = migrate(data); }
    catch (e) { toast('That backup could not be read.', 'err'); return; }

    var counts = {
      properties: candidate.properties.length, units: candidate.units.length,
      tenants: candidate.tenants.length, leases: candidate.leases.length,
      payments: candidate.payments.length, expenses: candidate.expenses.length,
      maintenance: candidate.maintenance.length, records: candidate.records.length
    };
    var total = counts.properties + counts.tenants + counts.payments + counts.expenses + counts.maintenance;
    if (!total) { toast('That backup contains no properties, rent, expenses or maintenance records.', 'err'); return; }

    var foreign = envelopeId && !isKnownAppId(envelopeId);
    var body = '<div class="stack">' +
      (foreign ? '<div class="flag bad">' + ico('alert') + '<span class="grow">This backup was created by a different FinNestStudio product (<strong>' +
        esc(parsed.appName || envelopeId) + '</strong>). Restoring it will replace everything currently in Rental Property Hub.</span></div>' : '') +
      '<div class="summary-strip">' +
        stripCell('Properties', nfmt(counts.properties)) + stripCell('Units', nfmt(counts.units)) +
        stripCell('Tenants', nfmt(counts.tenants)) + stripCell('Leases', nfmt(counts.leases)) +
        stripCell('Rent payments', nfmt(counts.payments)) + stripCell('Expenses', nfmt(counts.expenses)) +
        stripCell('Maintenance', nfmt(counts.maintenance)) + stripCell('Notes', nfmt(counts.records)) +
      '</div>' +
      (parsed.exportedAt ? '<div class="note">Backup created ' + esc(fmtDate(String(parsed.exportedAt).slice(0, 10))) + '.</div>' : '') +
      '<div class="flag">' + ico('alert') + '<span class="grow">Restoring replaces everything currently in the app. Download a backup of your current data first if you might need it.</span></div>' +
      '</div>';

    var ov = openModal(modalShell({
      title: 'Restore this backup?',
      sub: 'Here is what the file contains',
      body: body,
      foot: '<button class="btn" data-first>' + ico('download') + 'Back up current data first</button>' +
        '<span class="spacer"></span><button class="btn btn-ghost" data-x>Cancel</button>' +
        '<button class="btn btn-primary" data-go>Restore backup</button>'
    }));
    bindModalClose();
    ov.querySelector('[data-first]').addEventListener('click', doBackup);
    ov.querySelector('[data-go]').addEventListener('click', function () {
      closeModal();
      var snap = snapshotFor('restore');
      S = candidate;
      invalidateIndex(); _fmtCache = {};
      UI.propertyId = ''; UI.view = 'dashboard'; UI.rentMonth = thisMonth();
      save(true);
      render();
      offerUndo('Backup restored.', snap);
    });
  });
}

function exportRange() {
  var yr = UI.exportYear || fyRange(0).fyStartYear;
  var fs = clamp(Math.floor(num(S.settings.fyStartMonth) || 1), 1, 12);
  return { from: toISO(new Date(yr, fs - 1, 1)), to: toISO(new Date(yr + 1, fs - 1, 0)), label: fyLabel(yr) };
}

/** Re-focus a search field after a re-render so typing is never interrupted. */
function refocus(id) {
  var el = byId(id);
  if (!el) return;
  try { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
}

function bindViewEvents() {
  var host = byId('view');

  /* period picker */
  var ps = byId('periodSel');
  if (ps) ps.addEventListener('change', function () {
    UI.period = ps.value;
    if (UI.period === 'custom' && !UI.customFrom) {
      var r = periodRange('thismonth');
      UI.customFrom = r.from; UI.customTo = r.to;
    }
    render();
  });
  var cf = byId('cFrom'), ct = byId('cTo');
  if (cf) cf.addEventListener('change', function () { UI.customFrom = cf.value; render(); });
  if (ct) ct.addEventListener('change', function () { UI.customTo = ct.value; render(); });

  /* tabs */
  host.querySelectorAll('[data-ptab]').forEach(function (b) {
    b.addEventListener('click', function () { UI.propTab = b.getAttribute('data-ptab'); UI.page = {}; render(); });
  });
  host.querySelectorAll('[data-rtab]').forEach(function (b) {
    b.addEventListener('click', function () { UI.rentTab = b.getAttribute('data-rtab'); UI.page = {}; render(); });
  });
  host.querySelectorAll('[data-etab]').forEach(function (b) {
    b.addEventListener('click', function () { UI.expTab = b.getAttribute('data-etab'); UI.page = {}; render(); });
  });
  host.querySelectorAll('[data-ttab]').forEach(function (b) {
    b.addEventListener('click', function () { UI.tenantTab = b.getAttribute('data-ttab'); UI.page = {}; render(); });
  });
  host.querySelectorAll('[data-reptab]').forEach(function (b) {
    b.addEventListener('click', function () { UI.reportTab = b.getAttribute('data-reptab'); UI.page = {}; render(); });
  });
  host.querySelectorAll('[data-reportprop]').forEach(function (s) {
    s.addEventListener('change', function () { UI.reportProperty = s.value; render(); });
  });

  /* filters */
  var filterMap = [
    ['data-rentfilter', 'rentFilter'], ['data-expfilter', 'expFilter'],
    ['data-maintfilter', 'maintFilter'], ['data-recfilter', 'recFilter']
  ];
  filterMap.forEach(function (pair) {
    host.querySelectorAll('[' + pair[0] + ']').forEach(function (el) {
      el.addEventListener('change', function () {
        UI[pair[1]][el.getAttribute(pair[0])] = el.value;
        UI.page = {};
        render();
      });
    });
  });
  host.querySelectorAll('[data-tfilter]').forEach(function (b) {
    b.addEventListener('click', function () { UI.tenantFilter.status = b.getAttribute('data-tfilter'); render(); });
  });

  /* searches — debounced, and focus is restored after the re-render */
  [['rentSearch', 'rentFilter'], ['expSearch', 'expFilter'], ['maintSearch', 'maintFilter'],
   ['tenantSearch', 'tenantFilter'], ['recSearch', 'recFilter']].forEach(function (pair) {
    var el = byId(pair[0]);
    if (!el) return;
    el.addEventListener('input', debounce(function () {
      UI[pair[1]].search = el.value;
      UI.page = {};
      render();
      refocus(pair[0]);
    }, 230));
  });

  /* sorting */
  host.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var table = th.getAttribute('data-sorttable'), key = th.getAttribute('data-sort');
      var st = UI.sort[table] || (UI.sort[table] = { key: key, dir: 'desc' });
      if (st.key === key) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
      else { st.key = key; st.dir = 'desc'; }
      UI.page[table] = 1;
      render();
    });
    th.setAttribute('tabindex', '0');
    th.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); th.click(); }
    });
  });

  /* paging */
  host.querySelectorAll('[data-page]').forEach(function (b) {
    b.addEventListener('click', function () {
      UI.page[b.getAttribute('data-page')] = +b.getAttribute('data-pageno');
      render();
    });
  });

  /* export year */
  var ey = byId('expYear');
  if (ey) ey.addEventListener('change', function () { UI.exportYear = +ey.value; render(); });

  /* settings */
  bindSettings(host);
}

function bindSettings(host) {
  var map = {
    setCurrency: function (v) { S.settings.currency = v; _fmtCache = {}; },
    setSymbol: function (v) { S.settings.customSymbol = v || '$'; _fmtCache = {}; },
    setDateFormat: function (v) { S.settings.dateFormat = v; },
    setDistance: function (v) { S.settings.distanceUnit = v === 'km' ? 'km' : 'mi'; },
    setMileageRate: function (v) { S.settings.mileageRate = Math.max(0, num(v)); },
    setFyStart: function (v) { S.settings.fyStartMonth = clamp(Math.floor(num(v)) || 1, 1, 12); },
    setDueDay: function (v) { S.settings.defaultDueDay = clamp(Math.floor(num(v)) || 1, 1, 31); },
    setGrace: function (v) { S.settings.graceDays = clamp(Math.floor(num(v)), 0, 60); },
    setPortfolio: function (v) { S.settings.portfolioName = String(v || ''); },
    setStartPage: function (v) { S.settings.startPage = v; }
  };
  Object.keys(map).forEach(function (id) {
    var el = host.querySelector('#' + id);
    if (!el) return;
    var handler = function () { map[id](el.value); save(); render(); };
    el.addEventListener('change', handler);
  });
  host.querySelectorAll('[data-listinput]').forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var key = el.getAttribute('data-listinput');
      var btn = host.querySelector('[data-act="list-add"][data-key="' + key + '"]');
      if (btn) btn.click();
    });
  });
}

/* --- global handlers ------------------------------------------------------ */
document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var fn = ACTIONS[act];
  if (!fn) return;
  e.preventDefault();
  try { fn(el); }
  catch (err) { console.error(err); toast('That action could not be completed.', 'err'); }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && modalStack.length) { e.preventDefault(); closeModal(); return; }
  var tag = (e.target && e.target.tagName) || '';
  if (/INPUT|SELECT|TEXTAREA/.test(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (modalStack.length) return;
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); openPaymentModal(); }
  else if (e.key === 'p' || e.key === 'P') { e.preventDefault(); openPropertyModal(); }
  else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); openExpenseModal(); }
  else if (e.key === 'm' || e.key === 'M') { e.preventDefault(); openMaintModal(); }
  else if (e.key === '/') {
    var s = byId('rentSearch') || byId('expSearch') || byId('maintSearch') || byId('tenantSearch') || byId('recSearch');
    if (s) { e.preventDefault(); s.focus(); }
  }
});

byId('menuBtn').addEventListener('click', function () { document.body.classList.toggle('nav-open'); });
byId('scrim').addEventListener('click', function () { document.body.classList.remove('nav-open'); });

/* Keep focus inside an open modal for keyboard users. */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Tab' || !modalStack.length) return;
  var ov = modalStack[modalStack.length - 1];
  var f = ov.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])');
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
